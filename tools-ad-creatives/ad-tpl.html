<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@900&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:var(--h);overflow:hidden;background:#282924}
.ph{position:absolute;left:0;right:0;top:0;height:var(--ph);background-size:cover;background-position:var(--pos)}
.ph::after{content:'';position:absolute;left:0;right:0;bottom:0;height:160px;background:linear-gradient(180deg,rgba(40,41,36,0),#282924)}
.free{position:absolute;left:56px;top:var(--freetop);background:#ED1C24;color:#fff;font:800 46px/1 'Barlow Condensed';letter-spacing:.1em;padding:16px 26px 14px;border-radius:8px;text-transform:uppercase;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.panel{position:absolute;left:56px;right:56px;top:var(--pt);color:#fff}
.k{font:700 38px/1 'Barlow Condensed';letter-spacing:.16em;text-transform:uppercase;color:#FFDE16}
h1{font:900 104px/1.02 'Merriweather',serif;margin:18px 0 26px}
.when{font:800 66px/1.05 'Barlow Condensed';text-transform:uppercase;color:#FFDE16;letter-spacing:.01em}
.row{font:600 42px/1.25 'Barlow Condensed';color:rgba(255,255,255,.92);margin-top:12px}
.row b{font-weight:800;color:#fff}
.foot{position:absolute;left:56px;right:56px;top:var(--ft);display:flex;align-items:center;justify-content:space-between;border-top:2px solid rgba(255,255,255,.18);padding-top:26px}
.foot img{height:78px}
.foot span{font:700 34px 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75);text-align:right}
</style></head><body>
<div class="ph" style="background-image:url('PHOTO')"></div>
<div class="free">Free &middot; No cost, ever</div>
<div class="panel">
  <div class="k">KICKER</div>
  <h1>Healing Group</h1>
  <div class="when">WHEN</div>
  <div class="row">ROW1</div>
  <div class="row">ROW2</div>
</div>
<div class="foot"><img src="../brand/lutheranindianMinistries-logo-horz-stacked-2026-over-dark-background.svg"><span>Adults 18+<br>Rooted in Scripture</span></div>
</body></html>
