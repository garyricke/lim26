.”"], [19, "Then Nebuchadnezzar was filled with fury, and the expression of his face was changed against Shadrach, Meshach, and Abednego. He ordered the furnace heated seven times more than it was usually heated."]]}], "lesson": "The rage of power when it is defied — and its powerlessness before God.", "question": "Nebuchadnezzar's face changed. What does your anger look like from the outside — and what does it cost the people who see it?"}, {"n": 22, "title": "Herod and the children of Bethlehem", "where": "Matthew 2:16-18", "summary": "Tricked by the wise men, Herod becomes furious and kills every boy in Bethlehem two years old and under.", "passages": [{"label": "Matthew 2:16–18", "link": "https://www.esv.org/Matthew+2:16-18/", "verses": [[16, "Then Herod, when he saw that he had been tricked by the wise men, became furious, and he sent and killed all the male children in Bethlehem and in all that region who were two years old or under, according to the time that he had ascertained from the wise men."], [17, "Then was fulfilled what was spoken by the prophet Jeremiah:"], [18, "“A voice was heard in Ramah, weeping and loud lamentation, Rachel weeping for her children; she refused to be comforted, because they are no more.”"]]}], "lesson": "Anger with unchecked power behind it is the most dangerous anger in Scripture.", "question": "Herod's fear became fury with power behind it. Where does your anger have power over people who can't answer back?"}, {"n": 23, "title": "The synagogue at Nazareth", "where": "Luke 4:24-30", "summary": "Jesus reminds his hometown that God's grace went to a widow in Sidon and a Syrian leper. All in the synagogue are filled with wrath and drive him to the cliff's edge.", "passages": [{"label": "Luke 4:24–30", "link": "https://www.esv.org/Luke+4:24-30/", "verses": [[24, "And he said, “Truly, I say to you, no prophet is acceptable in his hometown."], [25, "But in truth, I tell you, there were many widows in Israel in the days of Elijah, when the heavens were shut up three years and six months, and a great famine came over all the land,"], [26, "and Elijah was sent to none of them but only to Zarephath, in the land of Sidon, to a woman who was a widow."], [27, "And there were many lepers in Israel in the time of the prophet Elisha, and none of them was cleansed, but only Naaman the Syrian.”"], [28, "When they heard these things, all in the synagogue were filled with wrath."], [29, "And they rose up and drove him out of the town and brought him to the brow of the hill on which their town was built, so that they could throw him down the cliff."], [30, "But passing through their midst, he went away."]]}], "lesson": "Religious anger at the reach of grace — the same anger as Jonah's, now aimed at Jesus.", "question": "The synagogue was fine until grace reached outsiders. What limits do you quietly put on who deserves God's kindness?"}, {"n": 24, "title": "Jesus angry in the synagogue", "where": "Mark 3:1-6", "summary": "A man with a withered hand; watchers waiting to accuse. Jesus looks around at them with anger, grieved at their hardness of heart, heals the man — and they go out to plot his death.", "passages": [{"label": "Mark 3:1–6", "link": "https://www.esv.org/Mark+3:1-6/", "verses": [[1, "Again he entered the synagogue, and a man was there with a withered hand."], [2, "And they watched Jesus, to see whether he would heal him on the Sabbath, so that they might accuse him."], [3, "And he said to the man with the withered hand, “Come here.”"], [4, "And he said to them, “Is it lawful on the Sabbath to do good or to do harm, to save life or to kill?” But they were silent."], [5, "And he looked around at them with anger, grieved at their hardness of heart, and said to the man, “Stretch out your hand.” He stretched it out, and his hand was restored."], [6, "The Pharisees went out and immediately held counsel with the Herodians against him, how to destroy him."]]}], "lesson": "Jesus' anger: aimed at hardness of heart, mixed with grief, and expressed as an act of mercy. This is the model of righteous anger.", "question": "Jesus was angry and grieved at the same time, and the result was a healed hand. What would it mean for your anger to end in mercy?"}, {"n": 25, "title": "Jesus clears the temple", "where": "John 2:13-17", "summary": "Jesus makes a whip of cords and drives out the animals and the money-changers: 'Do not make my Father's house a house of trade.' His disciples remember, 'Zeal for your house will consume me.'", "passages": [{"label": "John 2:13–17", "link": "https://www.esv.org/John+2:13-17/", "verses": [[13, "The Passover of the Jews was at hand, and Jesus went up to Jerusalem."], [14, "In the temple he found those who were selling oxen and sheep and pigeons, and the money-changers sitting there."], [15, "And making a whip of cords, he drove them all out of the temple, with the sheep and oxen. And he poured out the coins of the money-changers and overturned their tables."], [16, "And he told those who sold the pigeons, “Take these things away; do not make my Father's house a house of trade.”"], [17, "His disciples remembered that it was written, “Zeal for your house will consume me.”"]]}], "lesson": "Zeal for God's honour, deliberate (he made the whip), directed at exploitation — not at people who had wronged him personally.", "question": "Jesus made the whip — this was deliberate, not a flash. How do you tell zeal for God's honour from anger at your own?"}, {"n": 26, "title": "James and John want fire from heaven", "where": "Luke 9:51-56", "summary": "A Samaritan village refuses Jesus. James and John ask if they should call down fire. Jesus turns and rebukes them, and they go to another village.", "passages": [{"label": "Luke 9:51–56", "link": "https://www.esv.org/Luke+9:51-56/", "verses": [[51, "When the days drew near for him to be taken up, he set his face to go to Jerusalem."], [52, "And he sent messengers ahead of him, who went and entered a village of the Samaritans, to make preparations for him."], [53, "But the people did not receive him, because his face was set toward Jerusalem."], [54, "And when his disciples James and John saw it, they said, “Lord, do you want us to tell fire to come down from heaven and consume them?”"], [55, "But he turned and rebuked them."], [56, "And they went on to another village."]]}], "lesson": "Zeal for Jesus is not the same as the Spirit of Jesus. He rebukes the anger, not the villagers.", "question": "James and John wanted fire for Jesus' sake. When has loyalty made you crueller than the one you're loyal to?"}, {"n": 27, "title": "The unforgiving servant", "where": "Matthew 18:21-35", "summary": "Forgiven a debt he could never pay, a servant seizes a fellow servant by the throat over a small one. His master, in anger, hands him over — 'So also my heavenly Father will do to every one of you, if you do not forgive your brother from your heart.'", "passages": [{"label": "Matthew 18:21–22", "link": "https://www.esv.org/Matthew+18:21-22/", "verses": [[21, "Then Peter came up and said to him, “Lord, how often will my brother sin against me, and I forgive him? As many as seven times?”"], [22, "Jesus said to him, “I do not say to you seven times, but seventy-seven times."]]}, {"label": "Matthew 18:28–35", "link": "https://www.esv.org/Matthew+18:28-35/", "verses": [[28, "But when that same servant went out, he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began to choke him, saying, ‘Pay what you owe.’"], [29, "So his fellow servant fell down and pleaded with him, ‘Have patience with me, and I will pay you.’"], [30, "He refused and went and put him in prison until he should pay the debt."], [31, "When his fellow servants saw what had taken place, they were greatly distressed, and they went and reported to their master all that had taken place."], [32, "Then his master summoned him and said to him, ‘You wicked servant! I forgave you all that debt because you pleaded with me."], [33, "And should not you have had mercy on your fellow servant, as I had mercy on you?’"], [34, "And in anger his master delivered him to the jailers, until he should pay all his debt."], [35, "So also my heavenly Father will do to every one of you, if you do not forgive your brother from your heart.”"]]}], "lesson": "Jesus ties our anger toward others directly to how much we have grasped of our own forgiveness.", "question": "The servant was forgiven a fortune and choked a man over pennies. What debt has God cancelled for you — and who are you still holding by the throat?"}, {"n": 28, "title": "The older brother", "where": "Luke 15:25-32", "summary": "The prodigal comes home to a feast; the older brother hears the music, becomes angry and refuses to go in. The father comes out to him too, and the story ends without telling us whether he went in.", "passages": [{"label": "Luke 15:25–32", "link": "https://www.esv.org/Luke+15:25-32/", "verses": [[25, "“Now his older son was in the field, and as he came and drew near to the house, he heard music and dancing."], [26, "And he called one of the servants and asked what these things meant."], [27, "And he said to him, ‘Your brother has come, and your father has killed the fattened calf, because he has received him back safe and sound.’"], [28, "But he was angry and refused to go in. His father came out and entreated him,"], [29, "but he answered his father, ‘Look, these many years I have served you, and I never disobeyed your command, yet you never gave me a young goat, that I might celebrate with my friends."], [30, "But when this son of yours came, who has devoured your property with prostitutes, you killed the fattened calf for him!’"], [31, "And he said to him, ‘Son, you are always with me, and all that is mine is yours."], [32, "It was fitting to celebrate and be glad, for this your brother was dead, and is alive; he was lost, and is found.’”"]]}], "lesson": "The anger of the faithful when grace seems unfair. The father pleads rather than scolds.", "question": "The older brother wouldn't go in, and the father came out to him too. Where are you standing outside the feast?"}, {"n": 29, "title": "Peter draws the sword", "where": "John 18:10-11", "summary": "In the garden Peter strikes the high priest's servant and cuts off his ear. Jesus: 'Put your sword into its sheath; shall I not drink the cup that the Father has given me?' Luke adds that Jesus healed the ear.", "passages": [{"label": "John 18:10–11", "link": "https://www.esv.org/John+18:10-11/", "verses": [[10, "Then Simon Peter, having a sword, drew it and struck the high priest's servant and cut off his right ear. (The servant's name was Malchus.)"], [11, "So Jesus said to Peter, “Put your sword into its sheath; shall I not drink the cup that the Father has given me?”"]]}, {"label": "Luke 22:49–51", "link": "https://www.esv.org/Luke+22:49-51/", "verses": [[49, "And when those who were around him saw what would follow, they said, “Lord, shall we strike with the sword?”"], [50, "And one of them struck the servant of the high priest and cut off his right ear."], [51, "But Jesus said, “No more of this!” And he touched his ear and healed him."]]}], "lesson": "Loyal anger, instant and physical; and Jesus undoing its damage.", "question": "Peter's sword was drawn out of love. What damage has your loyal anger done that Jesus would have to heal?"}, {"n": 30, "title": "The stoning of Stephen", "where": "Acts 7:54-60", "summary": "Hearing Stephen's sermon, the council is enraged and grinds their teeth; they stop their ears, rush at him and stone him. Stephen dies praying, 'Lord, do not hold this sin against them.'", "passages": [{"label": "Acts 7:54–60", "link": "https://www.esv.org/Acts+7:54-60/", "verses": [[54, "Now when they heard these things they were enraged, and they ground their teeth at him."], [55, "But he, full of the Holy Spirit, gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God."], [56, "And he said, “Behold, I see the heavens opened, and the Son of Man standing at the right hand of God.”"], [57, "But they cried out with a loud voice and stopped their ears and rushed together at him."], [58, "Then they cast him out of the city and stoned him. And the witnesses laid down their garments at the feet of a young man named Saul."], [59, "And as they were stoning Stephen, he called out, “Lord Jesus, receive my spirit.”"], [60, "And falling to his knees he cried out with a loud voice, “Lord, do not hold this sin against them.” And when he had said this, he fell asleep."]]}], "lesson": "Two responses to the same moment: a mob's rage, and a man's forgiveness with his last breath.", "question": "Stephen prayed for the people killing him. Where does that kind of forgiveness come from, and can it be learned?"}, {"n": 31, "title": "Paul and Barnabas part ways", "where": "Acts 15:36-41", "summary": "Over whether to take John Mark, there is a sharp disagreement — sharp enough that they separate. Later letters show the breach healed: Paul asks for Mark, 'for he is very useful to me.'", "passages": [{"label": "Acts 15:36–41", "link": "https://www.esv.org/Acts+15:36-41/", "verses": [[36, "And after some days Paul said to Barnabas, “Let us return and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”"], [37, "Now Barnabas wanted to take with them John called Mark."], [38, "But Paul thought best not to take with them one who had withdrawn from them in Pamphylia and had not gone with them to the work."], [39, "And there arose a sharp disagreement, so that they separated from each other. Barnabas took Mark with him and sailed away to Cyprus,"], [40, "but Paul chose Silas and departed, having been commended by the brothers to the grace of the Lord."], [41, "And he went through Syria and Cilicia, strengthening the churches."]]}, {"label": "2 Timothy 4:11", "link": "https://www.esv.org/2+Timothy+4:11/", "verses": [[11, "Luke alone is with me. Get Mark and bring him with you, for he is very useful to me for ministry."]]}], "lesson": "Anger between good people over a real difference; separation for a season, and reconciliation later.", "question": "Two good men disagreed sharply and separated for a time. Is there a fallout in your life that God may be ready to mend?"}, {"n": 32, "title": "The riot in Ephesus", "where": "Acts 19:23-41", "summary": "Demetrius the silversmith stirs up the craftsmen, and the city is in confusion: two hours of shouting, most of them not knowing why they had come. The town clerk quiets the crowd with plain reasoning and sends them home.", "passages": [{"label": "Acts 19:28–32", "link": "https://www.esv.org/Acts+19:28-32/", "verses": [[28, "When they heard this they were enraged and were crying out, “Great is Artemis of the Ephesians!”"], [29, "So the city was filled with the confusion, and they rushed together into the theater, dragging with them Gaius and Aristarchus, Macedonians who were Paul's companions in travel."], [30, "But when Paul wished to go in among the crowd, the disciples would not let him."], [31, "And even some of the Asiarchs, who were friends of his, sent to him and were urging him not to venture into the theater."], [32, "Now some cried out one thing, some another, for the assembly was in confusion, and most of them did not know why they had come together."]]}, {"label": "Acts 19:35–41", "link": "https://www.esv.org/Acts+19:35-41/", "verses": [[35, "And when the town clerk had quieted the crowd, he said, “Men of Ephesus, who is there who does not know that the city of the Ephesians is temple keeper of the great Artemis, and of the sacred stone that fell from the sky?"], [36, "Seeing then that these things cannot be denied, you ought to be quiet and do nothing rash."], [37, "For you have brought these men here who are neither sacrilegious nor blasphemers of our goddess."], [38, "If therefore Demetrius and the craftsmen with him have a complaint against anyone, the courts are open, and there are proconsuls. Let them bring charges against one another."], [39, "But if you seek anything further, it shall be settled in the regular assembly."], [40, "For we really are in danger of being charged with rioting today, since there is no cause that we can give to justify this commotion.”"], [41, "And when he had said these things, he dismissed the assembly."]]}], "lesson": "Crowd anger: contagious, largely uninformed, and calmed by a steady voice that names the facts.", "question": "Most of the crowd didn't know why they were shouting. When has your anger belonged to a crowd rather than to you?"}], "paths": [{"id": "hurt", "title": "Someone hurt me and I can't let it go", "intro": "Anger that is really a wound. This path goes from what God says about settling accounts, through two men who had every right to revenge, to the forgiveness Jesus ties to our own.", "stops": [{"kind": "passage", "p": {"label": "Leviticus 19:17–18", "link": "https://www.esv.org/Leviticus+19:17-18/", "verses": [[17, "“You shall not hate your brother in your heart, but you shall reason frankly with your neighbor, lest you incur sin because of him."], [18, "You shall not take vengeance or bear a grudge against the sons of your own people, but you shall love your neighbor as yourself: I am the LORD."]]}}, {"kind": "theme", "n": 6}, {"kind": "story", "n": 4}, {"kind": "story", "n": 11}, {"kind": "story", "n": 27}, {"kind": "passage", "p": {"label": "Ephesians 4:31–32", "link": "https://www.esv.org/Ephesians+4:31-32/", "verses": [[31, "Let all bitterness and wrath and anger and clamor and slander be put away from you, along with all malice."], [32, "Be kind to one another, tenderhearted, forgiving one another, as God in Christ forgave you."]]}}, {"kind": "theme", "n": 8}]}, {"id": "temper", "title": "I lose my temper fast", "intro": "The quick fuse. Proverbs first, then three men whose one rash moment cost them, then the one man who paused.", "stops": [{"kind": "theme", "n": 3}, {"kind": "story", "n": 7}, {"kind": "story", "n": 5}, {"kind": "story", "n": 17}, {"kind": "story", "n": 18}, {"kind": "passage", "p": {"label": "James 1:19–21", "link": "https://www.esv.org/James+1:19-21/", "verses": [[19, "Know this, my beloved brothers: let every person be quick to hear, slow to speak, slow to anger;"], [20, "for the anger of man does not produce the righteousness of God."], [21, "Therefore put away all filthiness and rampant wickedness and receive with meekness the implanted word, which is able to save your souls."]]}}, {"kind": "passage", "p": {"label": "Proverbs 16:32", "link": "https://www.esv.org/Proverbs+16:32/", "verses": [[32, "Whoever is slow to anger is better than the mighty, and he who rules his spirit than he who takes a city."]]}}]}, {"id": "unfair", "title": "I'm angry at God, or at how unfair things are", "intro": "The anger that doesn't have a person to aim at. Two who were angry at God's mercy, the psalms that pray it honestly, and how God answers.", "stops": [{"kind": "story", "n": 20}, {"kind": "story", "n": 28}, {"kind": "passage", "p": {"label": "Habakkuk 1:2–4", "link": "https://www.esv.org/Habakkuk+1:2-4/", "verses": [[2, "O LORD, how long shall I cry for help, and you will not hear? Or cry to you “Violence!” and you will not save?"], [3, "Why do you make me see iniquity, and why do you idly look at wrong? Destruction and violence are before me; strife and contention arise."], [4, "So the law is paralyzed, and justice never goes forth. For the wicked surround the righteous; so justice goes forth perverted."]]}}, {"kind": "passage", "p": {"label": "Psalm 73:21–26", "link": "https://www.esv.org/Psalm+73:21-26/", "verses": [[21, "When my soul was embittered, when I was pricked in heart,"], [22, "I was brutish and ignorant; I was like a beast toward you."], [23, "Nevertheless, I am continually with you; you hold my right hand."], [24, "You guide me with your counsel, and afterward you will receive me to glory."], [25, "Whom have I in heaven but you? And there is nothing on earth that I desire besides you."], [26, "My flesh and my heart may fail, but God is the strength of my heart and my portion forever."]]}}, {"kind": "passage", "p": {"label": "Psalm 13:1–6", "link": "https://www.esv.org/Psalm+13:1-6/", "verses": [[1, "How long, O LORD? Will you forget me forever? How long will you hide your face from me?"], [2, "How long must I take counsel in my soul and have sorrow in my heart all the day? How long shall my enemy be exalted over me?"], [3, "Consider and answer me, O LORD my God; light up my eyes, lest I sleep the sleep of death,"], [4, "lest my enemy say, “I have prevailed over him,” lest my foes rejoice because I am shaken."], [5, "But I have trusted in your steadfast love; my heart shall rejoice in your salvation."], [6, "I will sing to the LORD, because he has dealt bountifully with me."]]}}, {"kind": "theme", "n": 1}, {"kind": "passage", "p": {"label": "Romans 5:8–9", "link": "https://www.esv.org/Romans+5:8-9/", "verses": [[8, "but God shows his love for us in that while we were still sinners, Christ died for us."], [9, "Since, therefore, we have now been justified by his blood, much more shall we be saved by him from the wrath of God."]]}}]}, {"id": "grudge", "title": "I've held on to this for years", "intro": "Anger that went quiet and stayed. Two brothers who waited, the sun-goes-down verse, the root of bitterness, and the embrace that ended a twenty-year grudge.", "stops": [{"kind": "story", "n": 13}, {"kind": "story", "n": 14}, {"kind": "passage", "p": {"label": "Ephesians 4:26–27", "link": "https://www.esv.org/Ephesians+4:26-27/", "verses": [[26, "Be angry and do not sin; do not let the sun go down on your anger,"], [27, "and give no opportunity to the devil."]]}}, {"kind": "passage", "p": {"label": "Hebrews 12:14–15", "link": "https://www.esv.org/Hebrews+12:14-15/", "verses": [[14, "Strive for peace with everyone, and for the holiness without which no one will see the Lord."], [15, "See to it that no one fails to obtain the grace of God; that no “root of bitterness” springs up and causes trouble, and by it many become defiled;"]]}}, {"kind": "story", "n": 2}, {"kind": "passage", "p": {"label": "Colossians 3:12–15", "link": "https://www.esv.org/Colossians+3:12-15/", "verses": [[12, "Put on then, as God's chosen ones, holy and beloved, compassionate hearts, kindness, humility, meekness, and patience,"], [13, "bearing with one another and, if one has a complaint against another, forgiving each other; as the Lord has forgiven you, so you also must forgive."], [14, "And above all these put on love, which binds everything together in perfect harmony."], [15, "And let the peace of Christ rule in your hearts, to which indeed you were called in one body. And be thankful."]]}}]}, {"id": "atme", "title": "Someone is angry at me", "intro": "On the receiving end. A soft answer, the servants who reasoned with a raging man, the woman who met an army on the road, and what Jesus says to do before worship.", "stops": [{"kind": "passage", "p": {"label": "Proverbs 15:1", "link": "https://www.esv.org/Proverbs+15:1/", "verses": [[1, "A soft answer turns away wrath, but a harsh word stirs up anger."]]}}, {"kind": "story", "n": 15}, {"kind": "story", "n": 11}, {"kind": "passage", "p": {"label": "Matthew 5:21–26", "link": "https://www.esv.org/Matthew+5:21-26/", "verses": [[21, "“You have heard that it was said to those of old, ‘You shall not murder; and whoever murders will be liable to judgment.’"], [22, "But I say to you that everyone who is angry with his brother will be liable to judgment; whoever insults his brother will be liable to the council; and whoever says, ‘You fool!’ will be liable to the hell of fire."], [23, "So if you are offering your gift at the altar and there remember that your brother has something against you,"], [24, "leave your gift there before the altar and go. First be reconciled to your brother, and then come and offer your gift."], [25, "Come to terms quickly with your accuser while you are going with him to court, lest your accuser hand you over to the judge, and the judge to the guard, and you be put in prison."], [26, "Truly, I say to you, you will never get out until you have paid the last penny."]]}}, {"kind": "story", "n": 2}, {"kind": "passage", "p": {"label": "Romans 12:17–21", "link": "https://www.esv.org/Romans+12:17-21/", "verses": [[17, "Repay no one evil for evil, but give thought to do what is honorable in the sight of all."], [18, "If possible, so far as it depends on you, live peaceably with all."], [19, "Beloved, never avenge yourselves, but leave it to the wrath of God, for it is written, “Vengeance is mine, I will repay, says the Lord.”"], [20, "To the contrary, “if your enemy is hungry, feed him; if he is thirsty, give him something to drink; for by so doing you will heap burning coals on his head.”"], [21, "Do not be overcome by evil, but overcome evil with good."]]}}]}, {"id": "right", "title": "Is anger ever right?", "intro": "Yes — and the Bible shows what it looks like. God's own anger, Jesus angry in the synagogue and the temple, Nehemiah, and the verse that holds both sides together.", "stops": [{"kind": "theme", "n": 1}, {"kind": "story", "n": 24}, {"kind": "story", "n": 25}, {"kind": "story", "n": 18}, {"kind": "passage", "p": {"label": "Psalm 4:4–5", "link": "https://www.esv.org/Psalm+4:4-5/", "verses": [[4, "Be angry, and do not sin; ponder in your own hearts on your beds, and be silent. Selah"], [5, "Offer right sacrifices, and put your trust in the LORD."]]}}, {"kind": "passage", "p": {"label": "Ephesians 4:26–27", "link": "https://www.esv.org/Ephesians+4:26-27/", "verses": [[26, "Be angry and do not sin; do not let the sun go down on your anger,"], [27, "and give no opportunity to the devil."]]}}, {"kind": "story", "n": 26}]}, {"id": "home", "title": "Anger in my home", "intro": "Where it costs the most. Fathers and children, a father who did nothing, a family cursed by two sons' rage, and the words for under one roof.", "stops": [{"kind": "theme", "n": 7}, {"kind": "story", "n": 13}, {"kind": "story", "n": 3}, {"kind": "story", "n": 10}, {"kind": "passage", "p": {"label": "Colossians 3:19–21", "link": "https://www.esv.org/Colossians+3:19-21/", "verses": [[19, "Husbands, love your wives, and do not be harsh with them."], [20, "Children, obey your parents in everything, for this pleases the Lord."], [21, "Fathers, do not provoke your children, lest they become discouraged."]]}}, {"kind": "passage", "p": {"label": "1 Peter 3:8–9", "link": "https://www.esv.org/1+Peter+3:8-9/", "verses": [[8, "Finally, all of you, have unity of mind, sympathy, brotherly love, a tender heart, and a humble mind."], [9, "Do not repay evil for evil or reviling for reviling, but on the contrary, bless, for to this you were called, that you may obtain a blessing."]]}}, {"kind": "theme", "n": 8}]}], "conc": [{"b": "Genesis", "c": 4, "v": 5, "t": "but for Cain and his offering he had no regard. So Cain was very angry, and his face fell."}, {"b": "Genesis", "c": 4, "v": 6, "t": "The LORD said to Cain, “Why are you angry, and why has your face fallen?"}, {"b": "Genesis", "c": 18, "v": 30, "t": "Then he said, “Oh let not the Lord be angry, and I will speak. Suppose thirty are found there.” He answered, “I will not do it, if I find thirty there.”"}, {"b": "Genesis", "c": 18, "v": 32, "t": "Then he said, “Oh let not the Lord be angry, and I will speak again but this once. Suppose ten are found there.” He answered, “For the sake of ten I will not destroy it.”"}, {"b": "Genesis", "c": 27, "v": 44, "t": "and stay with him a while, until your brother's fury turns away —"}, {"b": "Genesis", "c": 27, "v": 45, "t": "until your brother's anger turns away from you, and he forgets what you have done to him. Then I will send and bring you from there. Why should I be bereft of you both in one day?”"}, {"b": "Genesis", "c": 30, "v": 2, "t": "Jacob's anger was kindled against Rachel, and he said, “Am I in the place of God, who has withheld from you the fruit of the womb?”"}, {"b": "Genesis", "c": 31, "v": 35, "t": "And she said to her father, “Let not my lord be angry that I cannot rise before you, for the way of women is upon me.” So he searched but did not find the household gods."}, {"b": "Genesis", "c": 31, "v": 36, "t": "Then Jacob became angry and berated Laban. Jacob said to Laban, “What is my offense? What is my sin, that you have hotly pursued me?"}, {"b": "Genesis", "c": 34, "v": 7, "t": "The sons of Jacob had come in from the field as soon as they heard of it, and the men were indignant and very angry, because he had done an outrageous thing in Israel by lying with Jacob's daughter, for such a thing must not be done."}, {"b": "Genesis", "c": 39, "v": 19, "t": "As soon as his master heard the words that his wife spoke to him, “This is the way your servant treated me,” his anger was kindled."}, {"b": "Genesis", "c": 40, "v": 2, "t": "And Pharaoh was angry with his two officers, the chief cupbearer and the chief baker,"}, {"b": "Genesis", "c": 41, "v": 10, "t": "When Pharaoh was angry with his servants and put me and the chief baker in custody in the house of the captain of the guard,"}, {"b": "Genesis", "c": 44, "v": 18, "t": "Then Judah went up to him and said, “Oh, my lord, please let your servant speak a word in my lord's ears, and let not your anger burn against your servant, for you are like Pharaoh himself."}, {"b": "Genesis", "c": 45, "v": 5, "t": "And now do not be distressed or angry with yourselves because you sold me here, for God sent me before you to preserve life."}, {"b": "Genesis", "c": 49, "v": 6, "t": "Let my soul come not into their council; O my glory, be not joined to their company. For in their anger they killed men, and in their willfulness they hamstrung oxen."}, {"b": "Genesis", "c": 49, "v": 7, "t": "Cursed be their anger, for it is fierce, and their wrath, for it is cruel! I will divide them in Jacob and scatter them in Israel."}, {"b": "Exodus", "c": 4, "v": 14, "t": "Then the anger of the LORD was kindled against Moses and he said, “Is there not Aaron, your brother, the Levite? I know that he can speak well. Behold, he is coming out to meet you, and when he sees you, he will be glad in his heart."}, {"b": "Exodus", "c": 11, "v": 8, "t": "And all these your servants shall come down to me and bow down to me, saying, ‘Get out, you and all the people who follow you.’ And after that I will go out.” And he went out from Pharaoh in hot anger."}, {"b": "Exodus", "c": 15, "v": 7, "t": "In the greatness of your majesty you overthrow your adversaries; you send out your fury; it consumes them like stubble."}, {"b": "Exodus", "c": 16, "v": 20, "t": "But they did not listen to Moses. Some left part of it till the morning, and it bred worms and stank. And Moses was angry with them."}, {"b": "Exodus", "c": 22, "v": 24, "t": "and my wrath will burn, and I will kill you with the sword, and your wives shall become widows and your children fatherless."}, {"b": "Exodus", "c": 32, "v": 10, "t": "Now therefore let me alone, that my wrath may burn hot against them and I may consume them, in order that I may make a great nation of you.”"}, {"b": "Exodus", "c": 32, "v": 11, "t": "But Moses implored the LORD his God and said, “O LORD, why does your wrath burn hot against your people, whom you have brought out of the land of Egypt with great power and with a mighty hand?"}, {"b": "Exodus", "c": 32, "v": 12, "t": "Why should the Egyptians say, ‘With evil intent did he bring them out, to kill them in the mountains and to consume them from the face of the earth’? Turn from your burning anger and relent from this disaster against your people."}, {"b": "Exodus", "c": 32, "v": 19, "t": "And as soon as he came near the camp and saw the calf and the dancing, Moses' anger burned hot, and he threw the tablets out of his hands and broke them at the foot of the mountain."}, {"b": "Exodus", "c": 32, "v": 22, "t": "And Aaron said, “Let not the anger of my lord burn hot. You know the people, that they are set on evil."}, {"b": "Exodus", "c": 34, "v": 6, "t": "The LORD passed before him and proclaimed, “The LORD, the LORD, a God merciful and gracious, slow to anger, and abounding in steadfast love and faithfulness,"}, {"b": "Leviticus", "c": 10, "v": 6, "t": "And Moses said to Aaron and to Eleazar and Ithamar his sons, “Do not let the hair of your heads hang loose, and do not tear your clothes, lest you die, and wrath come upon all the congregation; but let your brothers, the whole house of Israel, bewail the burning that the LORD has kindled."}, {"b": "Leviticus", "c": 10, "v": 16, "t": "Now Moses diligently inquired about the goat of the sin offering, and behold, it was burned up! And he was angry with Eleazar and Ithamar, the surviving sons of Aaron, saying,"}, {"b": "Leviticus", "c": 26, "v": 28, "t": "then I will walk contrary to you in fury, and I myself will discipline you sevenfold for your sins."}, {"b": "Numbers", "c": 1, "v": 53, "t": "But the Levites shall camp around the tabernacle of the testimony, so that there may be no wrath on the congregation of the people of Israel. And the Levites shall keep guard over the tabernacle of the testimony.”"}, {"b": "Numbers", "c": 11, "v": 1, "t": "And the people complained in the hearing of the LORD about their misfortunes, and when the LORD heard it, his anger was kindled, and the fire of the LORD burned among them and consumed some outlying parts of the camp."}, {"b": "Numbers", "c": 11, "v": 10, "t": "Moses heard the people weeping throughout their clans, everyone at the door of his tent. And the anger of the LORD blazed hotly, and Moses was displeased."}, {"b": "Numbers", "c": 11, "v": 33, "t": "While the meat was yet between their teeth, before it was consumed, the anger of the LORD was kindled against the people, and the LORD struck down the people with a very great plague."}, {"b": "Numbers", "c": 12, "v": 9, "t": "And the anger of the LORD was kindled against them, and he departed."}, {"b": "Numbers", "c": 14, "v": 18, "t": "‘The LORD is slow to anger and abounding in steadfast love, forgiving iniquity and transgression, but he will by no means clear the guilty, visiting the iniquity of the fathers on the children, to the third and the fourth generation.’"}, {"b": "Numbers", "c": 16, "v": 15, "t": "And Moses was very angry and said to the LORD, “Do not respect their offering. I have not taken one donkey from them, and I have not harmed one of them.”"}, {"b": "Numbers", "c": 16, "v": 22, "t": "And they fell on their faces and said, “O God, the God of the spirits of all flesh, shall one man sin, and will you be angry with all the congregation?”"}, {"b": "Numbers", "c": 16, "v": 46, "t": "And Moses said to Aaron, “Take your censer, and put fire on it from off the altar and lay incense on it and carry it quickly to the congregation and make atonement for them, for wrath has gone out from the LORD; the plague has begun.”"}, {"b": "Numbers", "c": 18, "v": 5, "t": "And you shall keep guard over the sanctuary and over the altar, that there may never again be wrath on the people of Israel."}, {"b": "Numbers", "c": 22, "v": 22, "t": "But God's anger was kindled because he went, and the angel of the LORD took his stand in the way as his adversary. Now he was riding on the donkey, and his two servants were with him."}, {"b": "Numbers", "c": 22, "v": 27, "t": "When the donkey saw the angel of the LORD, she lay down under Balaam. And Balaam's anger was kindled, and he struck the donkey with his staff."}, {"b": "Numbers", "c": 24, "v": 10, "t": "And Balak's anger was kindled against Balaam, and he struck his hands together. And Balak said to Balaam, “I called you to curse my enemies, and behold, you have blessed them these three times."}, {"b": "Numbers", "c": 25, "v": 3, "t": "So Israel yoked himself to Baal of Peor. And the anger of the LORD was kindled against Israel."}, {"b": "Numbers", "c": 25, "v": 4, "t": "And the LORD said to Moses, “Take all the chiefs of the people and hang them in the sun before the LORD, that the fierce anger of the LORD may turn away from Israel.”"}, {"b": "Numbers", "c": 25, "v": 11, "t": "“Phinehas the son of Eleazar, son of Aaron the priest, has turned back my wrath from the people of Israel, in that he was jealous with my jealousy among them, so that I did not consume the people of Israel in my jealousy."}, {"b": "Numbers", "c": 31, "v": 14, "t": "And Moses was angry with the officers of the army, the commanders of thousands and the commanders of hundreds, who had come from service in the war."}, {"b": "Numbers", "c": 32, "v": 10, "t": "And the LORD's anger was kindled on that day, and he swore, saying,"}, {"b": "Numbers", "c": 32, "v": 13, "t": "And the LORD's anger was kindled against Israel, and he made them wander in the wilderness forty years, until all the generation that had done evil in the sight of the LORD was gone."}, {"b": "Numbers", "c": 32, "v": 14, "t": "And behold, you have risen in your fathers' place, a brood of sinful men, to increase still more the fierce anger of the LORD against Israel!"}, {"b": "Deuteronomy", "c": 1, "v": 34, "t": "“And the LORD heard your words and was angered, and he swore,"}, {"b": "Deuteronomy", "c": 1, "v": 37, "t": "Even with me the LORD was angry on your account and said, ‘You also shall not go in there."}, {"b": "Deuteronomy", "c": 3, "v": 26, "t": "But the LORD was angry with me because of you and would not listen to me. And the LORD said to me, ‘Enough from you; do not speak to me of this matter again."}, {"b": "Deuteronomy", "c": 4, "v": 21, "t": "Furthermore, the LORD was angry with me because of you, and he swore that I should not cross the Jordan, and that I should not enter the good land that the LORD your God is giving you for an inheritance."}, {"b": "Deuteronomy", "c": 4, "v": 25, "t": "“When you father children and children's children, and have grown old in the land, if you act corruptly by making a carved image in the form of anything, and by doing what is evil in the sight of the LORD your God, so as to provoke him to anger,"}, {"b": "Deuteronomy", "c": 6, "v": 15, "t": "for the LORD your God in your midst is a jealous God — lest the anger of the LORD your God be kindled against you, and he destroy you from off the face of the earth."}, {"b": "Deuteronomy", "c": 7, "v": 4, "t": "for they would turn away your sons from following me, to serve other gods. Then the anger of the LORD would be kindled against you, and he would destroy you quickly."}, {"b": "Deuteronomy", "c": 9, "v": 7, "t": "Remember and do not forget how you provoked the LORD your God to wrath in the wilderness. From the day you came out of the land of Egypt until you came to this place, you have been rebellious against the LORD."}, {"b": "Deuteronomy", "c": 9, "v": 8, "t": "Even at Horeb you provoked the LORD to wrath, and the LORD was so angry with you that he was ready to destroy you."}, {"b": "Deuteronomy", "c": 9, "v": 18, "t": "Then I lay prostrate before the LORD as before, forty days and forty nights. I neither ate bread nor drank water, because of all the sin that you had committed, in doing what was evil in the sight of the LORD to provoke him to anger."}, {"b": "Deuteronomy", "c": 9, "v": 19, "t": "For I was afraid of the anger and hot displeasure that the LORD bore against you, so that he was ready to destroy you. But the LORD listened to me that time also."}, {"b": "Deuteronomy", "c": 9, "v": 20, "t": "And the LORD was so angry with Aaron that he was ready to destroy him. And I prayed for Aaron also at the same time."}, {"b": "Deuteronomy", "c": 9, "v": 22, "t": "“At Taberah also, and at Massah and at Kibroth-hattaavah you provoked the LORD to wrath."}, {"b": "Deuteronomy", "c": 11, "v": 17, "t": "then the anger of the LORD will be kindled against you, and he will shut up the heavens, so that there will be no rain, and the land will yield no fruit, and you will perish quickly off the good land that the LORD is giving you."}, {"b": "Deuteronomy", "c": 13, "v": 17, "t": "None of the devoted things shall stick to your hand, that the LORD may turn from the fierceness of his anger and show you mercy and have compassion on you and multiply you, as he swore to your fathers,"}, {"b": "Deuteronomy", "c": 19, "v": 6, "t": "lest the avenger of blood in hot anger pursue the manslayer and overtake him, because the way is long, and strike him fatally, though the man did not deserve to die, since he had not hated his neighbor in the past."}, {"b": "Deuteronomy", "c": 29, "v": 20, "t": "The LORD will not be willing to forgive him, but rather the anger of the LORD and his jealousy will smoke against that man, and the curses written in this book will settle upon him, and the LORD will blot out his name from under heaven."}, {"b": "Deuteronomy", "c": 29, "v": 23, "t": "the whole land burned out with brimstone and salt, nothing sown and nothing growing, where no plant can sprout, an overthrow like that of Sodom and Gomorrah, Admah, and Zeboiim, which the LORD overthrew in his anger and wrath —"}, {"b": "Deuteronomy", "c": 29, "v": 24, "t": "all the nations will say, ‘Why has the LORD done thus to this land? What caused the heat of this great anger?’"}, {"b": "Deuteronomy", "c": 29, "v": 27, "t": "Therefore the anger of the LORD was kindled against this land, bringing upon it all the curses written in this book,"}, {"b": "Deuteronomy", "c": 29, "v": 28, "t": "and the LORD uprooted them from their land in anger and fury and great wrath, and cast them into another land, as they are this day.’"}, {"b": "Deuteronomy", "c": 31, "v": 17, "t": "Then my anger will be kindled against them in that day, and I will forsake them and hide my face from them, and they will be devoured. And many evils and troubles will come upon them, so that they will say in that day, ‘Have not these evils come upon us because our God is not among us?’"}, {"b": "Deuteronomy", "c": 31, "v": 29, "t": "For I know that after my death you will surely act corruptly and turn aside from the way that I have commanded you. And in the days to come evil will befall you, because you will do what is evil in the sight of the LORD, provoking him to anger through the work of your hands.”"}, {"b": "Deuteronomy", "c": 32, "v": 16, "t": "They stirred him to jealousy with strange gods; with abominations they provoked him to anger."}, {"b": "Deuteronomy", "c": 32, "v": 21, "t": "They have made me jealous with what is no god; they have provoked me to anger with their idols. So I will make them jealous with those who are no people; I will provoke them to anger with a foolish nation."}, {"b": "Deuteronomy", "c": 32, "v": 22, "t": "For a fire is kindled by my anger, and it burns to the depths of Sheol, devours the earth and its increase, and sets on fire the foundations of the mountains."}, {"b": "Joshua", "c": 7, "v": 1, "t": "But the people of Israel broke faith in regard to the devoted things, for Achan the son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the devoted things. And the anger of the LORD burned against the people of Israel."}, {"b": "Joshua", "c": 7, "v": 26, "t": "And they raised over him a great heap of stones that remains to this day. Then the LORD turned from his burning anger. Therefore, to this day the name of that place is called the Valley of Achor."}, {"b": "Joshua", "c": 9, "v": 20, "t": "This we will do to them: let them live, lest wrath be upon us, because of the oath that we swore to them.”"}, {"b": "Joshua", "c": 22, "v": 18, "t": "that you too must turn away this day from following the LORD? And if you too rebel against the LORD today then tomorrow he will be angry with the whole congregation of Israel."}, {"b": "Joshua", "c": 22, "v": 20, "t": "Did not Achan the son of Zerah break faith in the matter of the devoted things, and wrath fell upon all the congregation of Israel? And he did not perish alone for his iniquity.’”"}, {"b": "Joshua", "c": 23, "v": 16, "t": "if you transgress the covenant of the LORD your God, which he commanded you, and go and serve other gods and bow down to them. Then the anger of the LORD will be kindled against you, and you shall perish quickly from off the good land that he has given to you.”"}, {"b": "Judges", "c": 2, "v": 12, "t": "And they abandoned the LORD, the God of their fathers, who had brought them out of the land of Egypt. They went after other gods, from among the gods of the peoples who were around them, and bowed down to them. And they provoked the LORD to anger."}, {"b": "Judges", "c": 2, "v": 14, "t": "So the anger of the LORD was kindled against Israel, and he gave them over to plunderers, who plundered them. And he sold them into the hand of their surrounding enemies, so that they could no longer withstand their enemies."}, {"b": "Judges", "c": 2, "v": 20, "t": "So the anger of the LORD was kindled against Israel, and he said, “Because this people have transgressed my covenant that I commanded their fathers and have not obeyed my voice,"}, {"b": "Judges", "c": 3, "v": 8, "t": "Therefore the anger of the LORD was kindled against Israel, and he sold them into the hand of Cushan-rishathaim king of Mesopotamia. And the people of Israel served Cushan-rishathaim eight years."}, {"b": "Judges", "c": 6, "v": 39, "t": "Then Gideon said to God, “Let not your anger burn against me; let me speak just once more. Please let me test just once more with the fleece. Please let it be dry on the fleece only, and on all the ground let there be dew.”"}, {"b": "Judges", "c": 8, "v": 3, "t": "God has given into your hands the princes of Midian, Oreb and Zeeb. What have I been able to do in comparison with you?” Then their anger against him subsided when he said this."}, {"b": "Judges", "c": 9, "v": 30, "t": "When Zebul the ruler of the city heard the words of Gaal the son of Ebed, his anger was kindled."}, {"b": "Judges", "c": 10, "v": 7, "t": "So the anger of the LORD was kindled against Israel, and he sold them into the hand of the Philistines and into the hand of the Ammonites,"}, {"b": "Judges", "c": 14, "v": 19, "t": "And the Spirit of the LORD rushed upon him, and he went down to Ashkelon and struck down thirty men of the town and took their spoil and gave the garments to those who had told the riddle. In hot anger he went back to his father's house."}, {"b": "Judges", "c": 18, "v": 25, "t": "And the people of Dan said to him, “Do not let your voice be heard among us, lest angry fellows fall upon you, and you lose your life with the lives of your household.”"}, {"b": "1 Samuel", "c": 1, "v": 6, "t": "And her rival used to provoke her grievously to irritate her, because the LORD had closed her womb."}, {"b": "1 Samuel", "c": 1, "v": 7, "t": "So it went on year by year. As often as she went up to the house of the LORD, she used to provoke her. Therefore Hannah wept and would not eat."}, {"b": "1 Samuel", "c": 11, "v": 6, "t": "And the Spirit of God rushed upon Saul when he heard these words, and his anger was greatly kindled."}, {"b": "1 Samuel", "c": 15, "v": 11, "t": "“I regret that I have made Saul king, for he has turned back from following me and has not performed my commandments.” And Samuel was angry, and he cried to the LORD all night."}, {"b": "1 Samuel", "c": 17, "v": 28, "t": "Now Eliab his eldest brother heard when he spoke to the men. And Eliab's anger was kindled against David, and he said, “Why have you come down? And with whom have you left those few sheep in the wilderness? I know your presumption and the evil of your heart, for you have come down to see the battle.”"}, {"b": "1 Samuel", "c": 18, "v": 8, "t": "And Saul was very angry, and this saying displeased him. He said, “They have ascribed to David ten thousands, and to me they have ascribed thousands, and what more can he have but the kingdom?”"}, {"b": "1 Samuel", "c": 20, "v": 7, "t": "If he says, ‘Good!’ it will be well with your servant, but if he is angry, then know that harm is determined by him."}, {"b": "1 Samuel", "c": 20, "v": 30, "t": "Then Saul's anger was kindled against Jonathan, and he said to him, “You son of a perverse, rebellious woman, do I not know that you have chosen the son of Jesse to your own shame, and to the shame of your mother's nakedness?"}, {"b": "1 Samuel", "c": 20, "v": 34, "t": "And Jonathan rose from the table in fierce anger and ate no food the second day of the month, for he was grieved for David, because his father had disgraced him."}, {"b": "1 Samuel", "c": 28, "v": 18, "t": "Because you did not obey the voice of the LORD and did not carry out his fierce wrath against Amalek, therefore the LORD has done this thing to you this day."}, {"b": "1 Samuel", "c": 29, "v": 4, "t": "But the commanders of the Philistines were angry with him. And the commanders of the Philistines said to him, “Send the man back, that he may return to the place to which you have assigned him. He shall not go down with us to battle, lest in the battle he become an adversary to us. For how could this fellow reconcile himself to his lord? Would it not be with the heads of the men here?"}, {"b": "2 Samuel", "c": 3, "v": 8, "t": "Then Abner was very angry over the words of Ish-bosheth and said, “Am I a dog's head of Judah? To this day I keep showing steadfast love to the house of Saul your father, to his brothers, and to his friends, and have not given you into the hand of David. And yet you charge me today with a fault concerning a woman."}, {"b": "2 Samuel", "c": 6, "v": 7, "t": "And the anger of the LORD was kindled against Uzzah, and God struck him down there because of his error, and he died there beside the ark of God."}, {"b": "2 Samuel", "c": 6, "v": 8, "t": "And David was angry because the LORD had broken out against Uzzah. And that place is called Perez-uzzah to this day."}, {"b": "2 Samuel", "c": 11, "v": 20, "t": "then, if the king's anger rises, and if he says to you, ‘Why did you go so near the city to fight? Did you not know that they would shoot from the wall?"}, {"b": "2 Samuel", "c": 12, "v": 5, "t": "Then David's anger was greatly kindled against the man, and he said to Nathan, “As the LORD lives, the man who has done this deserves to die,"}, {"b": "2 Samuel", "c": 13, "v": 21, "t": "When King David heard of all these things, he was very angry."}, {"b": "2 Samuel", "c": 17, "v": 8, "t": "Hushai said, “You know that your father and his men are mighty men, and that they are enraged, like a bear robbed of her cubs in the field. Besides, your father is expert in war; he will not spend the night with the people."}, {"b": "2 Samuel", "c": 19, "v": 42, "t": "All the men of Judah answered the men of Israel, “Because the king is our close relative. Why then are you angry over this matter? Have we eaten at all at the king's expense? Or has he given us any gift?”"}, {"b": "2 Samuel", "c": 22, "v": 8, "t": "“Then the earth reeled and rocked; the foundations of the heavens trembled and quaked, because he was angry."}, {"b": "2 Samuel", "c": 24, "v": 1, "t": "Again the anger of the LORD was kindled against Israel, and he incited David against them, saying, “Go, number Israel and Judah.”"}, {"b": "1 Kings", "c": 8, "v": 46, "t": "“If they sin against you — for there is no one who does not sin — and you are angry with them and give them to an enemy, so that they are carried away captive to the land of the enemy, far off or near,"}, {"b": "1 Kings", "c": 11, "v": 9, "t": "And the LORD was angry with Solomon, because his heart had turned away from the LORD, the God of Israel, who had appeared to him twice"}, {"b": "1 Kings", "c": 14, "v": 9, "t": "but you have done evil above all who were before you and have gone and made for yourself other gods and metal images, provoking me to anger, and have cast me behind your back,"}, {"b": "1 Kings", "c": 14, "v": 15, "t": "the LORD will strike Israel as a reed is shaken in the water, and root up Israel out of this good land that he gave to their fathers and scatter them beyond the Euphrates, because they have made their Asherim, provoking the LORD to anger."}, {"b": "1 Kings", "c": 14, "v": 22, "t": "And Judah did what was evil in the sight of the LORD, and they provoked him to jealousy with their sins that they committed, more than all that their fathers had done."}, {"b": "1 Kings", "c": 15, "v": 30, "t": "It was for the sins of Jeroboam that he sinned and that he made Israel to sin, and because of the anger to which he provoked the LORD, the God of Israel."}, {"b": "1 Kings", "c": 16, "v": 2, "t": "“Since I exalted you out of the dust and made you leader over my people Israel, and you have walked in the way of Jeroboam and have made my people Israel to sin, provoking me to anger with their sins,"}, {"b": "1 Kings", "c": 16, "v": 7, "t": "Moreover, the word of the LORD came by the prophet Jehu the son of Hanani against Baasha and his house, both because of all the evil that he did in the sight of the LORD, provoking him to anger with the work of his hands, in being like the house of Jeroboam, and also because he destroyed it."}, {"b": "1 Kings", "c": 16, "v": 13, "t": "for all the sins of Baasha and the sins of Elah his son, which they sinned and which they made Israel to sin, provoking the LORD God of Israel to anger with their idols."}, {"b": "1 Kings", "c": 16, "v": 26, "t": "For he walked in all the way of Jeroboam the son of Nebat, and in the sins that he made Israel to sin, provoking the LORD, the God of Israel, to anger by their idols."}, {"b": "1 Kings", "c": 16, "v": 33, "t": "And Ahab made an Asherah. Ahab did more to provoke the LORD, the God of Israel, to anger than all the kings of Israel who were before him."}, {"b": "1 Kings", "c": 21, "v": 22, "t": "And I will make your house like the house of Jeroboam the son of Nebat, and like the house of Baasha the son of Ahijah, for the anger to which you have provoked me, and because you have made Israel to sin."}, {"b": "1 Kings", "c": 22, "v": 53, "t": "He served Baal and worshiped him and provoked the LORD, the God of Israel, to anger in every way that his father had done."}, {"b": "2 Kings", "c": 3, "v": 27, "t": "Then he took his oldest son who was to reign in his place and offered him for a burnt offering on the wall. And there came great wrath against Israel. And they withdrew from him and returned to their own land."}, {"b": "2 Kings", "c": 5, "v": 11, "t": "But Naaman was angry and went away, saying, “Behold, I thought that he would surely come out to me and stand and call upon the name of the LORD his God, and wave his hand over the place and cure the leper."}, {"b": "2 Kings", "c": 5, "v": 12, "t": "Are not Abana and Pharpar, the rivers of Damascus, better than all the waters of Israel? Could I not wash in them and be clean?” So he turned and went away in a rage."}, {"b": "2 Kings", "c": 13, "v": 3, "t": "And the anger of the LORD was kindled against Israel, and he gave them continually into the hand of Hazael king of Syria and into the hand of Ben-hadad the son of Hazael."}, {"b": "2 Kings", "c": 13, "v": 19, "t": "Then the man of God was angry with him and said, “You should have struck five or six times; then you would have struck down Syria until you had made an end of it, but now you will strike down Syria only three times.”"}, {"b": "2 Kings", "c": 14, "v": 10, "t": "You have indeed struck down Edom, and your heart has lifted you up. Be content with your glory, and stay at home, for why should you provoke trouble so that you fall, you and Judah with you?”"}, {"b": "2 Kings", "c": 17, "v": 11, "t": "and there they made offerings on all the high places, as the nations did whom the LORD carried away before them. And they did wicked things, provoking the LORD to anger,"}, {"b": "2 Kings", "c": 17, "v": 17, "t": "And they burned their sons and their daughters as offerings and used divination and omens and sold themselves to do evil in the sight of the LORD, provoking him to anger."}, {"b": "2 Kings", "c": 17, "v": 18, "t": "Therefore the LORD was very angry with Israel and removed them out of his sight. None was left but the tribe of Judah only."}, {"b": "2 Kings", "c": 19, "v": 27, "t": "“But I know your sitting down and your going out and coming in, and your raging against me."}, {"b": "2 Kings", "c": 19, "v": 28, "t": "Because you have raged against me and your complacency has come into my ears, I will put my hook in your nose and my bit in your mouth, and I will turn you back on the way by which you came."}, {"b": "2 Kings", "c": 21, "v": 6, "t": "And he burned his son as an offering and used fortune-telling and omens and dealt with mediums and with necromancers. He did much evil in the sight of the LORD, provoking him to anger."}, {"b": "2 Kings", "c": 21, "v": 15, "t": "because they have done what is evil in my sight and have provoked me to anger, since the day their fathers came out of Egypt, even to this day.”"}, {"b": "2 Kings", "c": 22, "v": 13, "t": "“Go, inquire of the LORD for me, and for the people, and for all Judah, concerning the words of this book that has been found. For great is the wrath of the LORD that is kindled against us, because our fathers have not obeyed the words of this book, to do according to all that is written concerning us.”"}, {"b": "2 Kings", "c": 22, "v": 17, "t": "Because they have forsaken me and have made offerings to other gods, that they might provoke me to anger with all the work of their hands, therefore my wrath will be kindled against this place, and it will not be quenched."}, {"b": "2 Kings", "c": 23, "v": 19, "t": "And Josiah removed all the shrines also of the high places that were in the cities of Samaria, which kings of Israel had made, provoking the LORD to anger. He did to them according to all that he had done at Bethel."}, {"b": "2 Kings", "c": 23, "v": 26, "t": "Still the LORD did not turn from the burning of his great wrath, by which his anger was kindled against Judah, because of all the provocations with which Manasseh had provoked him."}, {"b": "2 Kings", "c": 24, "v": 20, "t": "For because of the anger of the LORD it came to the point in Jerusalem and Judah that he cast them out from his presence. And Zedekiah rebelled against the king of Babylon."}, {"b": "1 Chronicles", "c": 13, "v": 10, "t": "And the anger of the LORD was kindled against Uzzah, and he struck him down because he put out his hand to the ark, and he died there before God."}, {"b": "1 Chronicles", "c": 13, "v": 11, "t": "And David was angry because the LORD had broken out against Uzzah. And that place is called Perez-uzza to this day."}, {"b": "1 Chronicles", "c": 27, "v": 24, "t": "Joab the son of Zeruiah began to count, but did not finish. Yet wrath came upon Israel for this, and the number was not entered in the chronicles of King David."}, {"b": "2 Chronicles", "c": 6, "v": 36, "t": "“If they sin against you — for there is no one who does not sin — and you are angry with them and give them to an enemy, so that they are carried away captive to a land far or near,"}, {"b": "2 Chronicles", "c": 12, "v": 7, "t": "When the LORD saw that they humbled themselves, the word of the LORD came to Shemaiah: “They have humbled themselves. I will not destroy them, but I will grant them some deliverance, and my wrath shall not be poured out on Jerusalem by the hand of Shishak."}, {"b": "2 Chronicles", "c": 12, "v": 12, "t": "And when he humbled himself the wrath of the LORD turned from him, so as not to make a complete destruction. Moreover, conditions were good in Judah."}, {"b": "2 Chronicles", "c": 16, "v": 10, "t": "Then Asa was angry with the seer and put him in the stocks in prison, for he was in a rage with him because of this. And Asa inflicted cruelties upon some of the people at the same time."}, {"b": "2 Chronicles", "c": 19, "v": 2, "t": "But Jehu the son of Hanani the seer went out to meet him and said to King Jehoshaphat, “Should you help the wicked and love those who hate the LORD? Because of this, wrath has gone out against you from the LORD."}, {"b": "2 Chronicles", "c": 19, "v": 10, "t": "whenever a case comes to you from your brothers who live in their cities, concerning bloodshed, law or commandment, statutes or rules, then you shall warn them, that they may not incur guilt before the LORD and wrath may not come upon you and your brothers. Thus you shall do, and you will not incur guilt."}, {"b": "2 Chronicles", "c": 21, "v": 16, "t": "And the LORD stirred up against Jehoram the anger of the Philistines and of the Arabians who are near the Ethiopians."}, {"b": "2 Chronicles", "c": 24, "v": 18, "t": "And they abandoned the house of the LORD, the God of their fathers, and served the Asherim and the idols. And wrath came upon Judah and Jerusalem for this guilt of theirs."}, {"b": "2 Chronicles", "c": 25, "v": 10, "t": "Then Amaziah discharged the army that had come to him from Ephraim to go home again. And they became very angry with Judah and returned home in fierce anger."}, {"b": "2 Chronicles", "c": 25, "v": 15, "t": "Therefore the LORD was angry with Amaziah and sent to him a prophet, who said to him, “Why have you sought the gods of a people who did not deliver their own people from your hand?”"}, {"b": "2 Chronicles", "c": 25, "v": 19, "t": "You say, ‘See, I have struck down Edom,’ and your heart has lifted you up in boastfulness. But now stay at home. Why should you provoke trouble so that you fall, you and Judah with you?”"}, {"b": "2 Chronicles", "c": 26, "v": 19, "t": "Then Uzziah was angry. Now he had a censer in his hand to burn incense, and when he became angry with the priests, leprosy broke out on his forehead in the presence of the priests in the house of the LORD, by the altar of incense."}, {"b": "2 Chronicles", "c": 28, "v": 9, "t": "But a prophet of the LORD was there, whose name was Oded, and he went out to meet the army that came to Samaria and said to them, “Behold, because the LORD, the God of your fathers, was angry with Judah, he gave them into your hand, but you have killed them in a rage that has reached up to heaven."}, {"b": "2 Chronicles", "c": 28, "v": 11, "t": "Now hear me, and send back the captives from your relatives whom you have taken, for the fierce wrath of the LORD is upon you.”"}, {"b": "2 Chronicles", "c": 28, "v": 13, "t": "and said to them, “You shall not bring the captives in here, for you propose to bring upon us guilt against the LORD in addition to our present sins and guilt. For our guilt is already great, and there is fierce wrath against Israel.”"}, {"b": "2 Chronicles", "c": 28, "v": 25, "t": "In every city of Judah he made high places to make offerings to other gods, provoking to anger the LORD, the God of his fathers."}, {"b": "2 Chronicles", "c": 29, "v": 8, "t": "Therefore the wrath of the LORD came on Judah and Jerusalem, and he has made them an object of horror, of astonishment, and of hissing, as you see with your own eyes."}, {"b": "2 Chronicles", "c": 29, "v": 10, "t": "Now it is in my heart to make a covenant with the LORD, the God of Israel, in order that his fierce anger may turn away from us."}, {"b": "2 Chronicles", "c": 30, "v": 8, "t": "Do not now be stiff-necked as your fathers were, but yield yourselves to the LORD and come to his sanctuary, which he has consecrated forever, and serve the LORD your God, that his fierce anger may turn away from you."}, {"b": "2 Chronicles", "c": 32, "v": 25, "t": "But Hezekiah did not make return according to the benefit done to him, for his heart was proud. Therefore wrath came upon him and Judah and Jerusalem."}, {"b": "2 Chronicles", "c": 32, "v": 26, "t": "But Hezekiah humbled himself for the pride of his heart, both he and the inhabitants of Jerusalem, so that the wrath of the LORD did not come upon them in the days of Hezekiah."}, {"b": "2 Chronicles", "c": 33, "v": 6, "t": "And he burned his sons as an offering in the Valley of the Son of Hinnom, and used fortune-telling and omens and sorcery, and dealt with mediums and with necromancers. He did much evil in the sight of the LORD, provoking him to anger."}, {"b": "2 Chronicles", "c": 34, "v": 21, "t": "“Go, inquire of the LORD for me and for those who are left in Israel and in Judah, concerning the words of the book that has been found. For great is the wrath of the LORD that is poured out on us, because our fathers have not kept the word of the LORD, to do according to all that is written in this book.”"}, {"b": "2 Chronicles", "c": 34, "v": 25, "t": "Because they have forsaken me and have made offerings to other gods, that they might provoke me to anger with all the works of their hands, therefore my wrath will be poured out on this place and will not be quenched."}, {"b": "2 Chronicles", "c": 36, "v": 16, "t": "But they kept mocking the messengers of God, despising his words and scoffing at his prophets, until the wrath of the LORD rose against his people, until there was no remedy."}, {"b": "Ezra", "c": 5, "v": 12, "t": "But because our fathers had angered the God of heaven, he gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean, who destroyed this house and carried away the people to Babylonia."}, {"b": "Ezra", "c": 7, "v": 23, "t": "Whatever is decreed by the God of heaven, let it be done in full for the house of the God of heaven, lest his wrath be against the realm of the king and his sons."}, {"b": "Ezra", "c": 8, "v": 22, "t": "For I was ashamed to ask the king for a band of soldiers and horsemen to protect us against the enemy on our way, since we had told the king, “The hand of our God is for good on all who seek him, and the power of his wrath is against all who forsake him.”"}, {"b": "Ezra", "c": 9, "v": 14, "t": "shall we break your commandments again and intermarry with the peoples who practice these abominations? Would you not be angry with us until you consumed us, so that there should be no remnant, nor any to escape?"}, {"b": "Ezra", "c": 10, "v": 14, "t": "Let our officials stand for the whole assembly. Let all in our cities who have taken foreign wives come at appointed times, and with them the elders and judges of every city, until the fierce wrath of our God over this matter is turned away from us.”"}, {"b": "Nehemiah", "c": 4, "v": 1, "t": "Now when Sanballat heard that we were building the wall, he was angry and greatly enraged, and he jeered at the Jews."}, {"b": "Nehemiah", "c": 4, "v": 5, "t": "Do not cover their guilt, and let not their sin be blotted out from your sight, for they have provoked you to anger in the presence of the builders."}, {"b": "Nehemiah", "c": 4, "v": 7, "t": "But when Sanballat and Tobiah and the Arabs and the Ammonites and the Ashdodites heard that the repairing of the walls of Jerusalem was going forward and that the breaches were beginning to be closed, they were very angry."}, {"b": "Nehemiah", "c": 5, "v": 6, "t": "I was very angry when I heard their outcry and these words."}, {"b": "Nehemiah", "c": 9, "v": 17, "t": "They refused to obey and were not mindful of the wonders that you performed among them, but they stiffened their neck and appointed a leader to return to their slavery in Egypt. But you are a God ready to forgive, gracious and merciful, slow to anger and abounding in steadfast love, and did not forsake them."}, {"b": "Nehemiah", "c": 13, "v": 8, "t": "And I was very angry, and I threw all the household furniture of Tobiah out of the chamber."}, {"b": "Nehemiah", "c": 13, "v": 18, "t": "Did not your fathers act in this way, and did not our God bring all this disaster on us and on this city? Now you are bringing more wrath on Israel by profaning the Sabbath.”"}, {"b": "Esther", "c": 1, "v": 12, "t": "But Queen Vashti refused to come at the king's command delivered by the eunuchs. At this the king became enraged, and his anger burned within him."}, {"b": "Esther", "c": 1, "v": 18, "t": "This very day the noble women of Persia and Media who have heard of the queen's behavior will say the same to all the king's officials, and there will be contempt and wrath in plenty."}, {"b": "Esther", "c": 2, "v": 1, "t": "After these things, when the anger of King Ahasuerus had abated, he remembered Vashti and what she had done and what had been decreed against her."}, {"b": "Esther", "c": 2, "v": 21, "t": "In those days, as Mordecai was sitting at the king's gate, Bigthan and Teresh, two of the king's eunuchs, who guarded the threshold, became angry and sought to lay hands on King Ahasuerus."}, {"b": "Esther", "c": 3, "v": 5, "t": "And when Haman saw that Mordecai did not bow down or pay homage to him, Haman was filled with fury."}, {"b": "Esther", "c": 5, "v": 9, "t": "And Haman went out that day joyful and glad of heart. But when Haman saw Mordecai in the king's gate, that he neither rose nor trembled before him, he was filled with wrath against Mordecai."}, {"b": "Esther", "c": 7, "v": 7, "t": "And the king arose in his wrath from the wine-drinking and went into the palace garden, but Haman stayed to beg for his life from Queen Esther, for he saw that harm was determined against him by the king."}, {"b": "Esther", "c": 7, "v": 10, "t": "So they hanged Haman on the gallows that he had prepared for Mordecai. Then the wrath of the king abated."}, {"b": "Job", "c": 4, "v": 9, "t": "By the breath of God they perish, and by the blast of his anger they are consumed."}, {"b": "Job", "c": 9, "v": 5, "t": "he who removes mountains, and they know it not, when he overturns them in his anger,"}, {"b": "Job", "c": 9, "v": 13, "t": "“God will not turn back his anger; beneath him bowed the helpers of Rahab."}, {"b": "Job", "c": 12, "v": 6, "t": "The tents of robbers are at peace, and those who provoke God are secure, who bring their god in their hand."}, {"b": "Job", "c": 14, "v": 13, "t": "Oh that you would hide me in Sheol, that you would conceal me until your wrath be past, that you would appoint me a set time, and remember me!"}, {"b": "Job", "c": 16, "v": 3, "t": "Shall windy words have an end? Or what provokes you that you answer?"}, {"b": "Job", "c": 16, "v": 9, "t": "He has torn me in his wrath and hated me; he has gnashed his teeth at me; my adversary sharpens his eyes against me."}, {"b": "Job", "c": 18, "v": 4, "t": "You who tear yourself in your anger, shall the earth be forsaken for you, or the rock be removed out of its place?"}, {"b": "Job", "c": 19, "v": 11, "t": "He has kindled his wrath against me and counts me as his adversary."}, {"b": "Job", "c": 19, "v": 29, "t": "be afraid of the sword, for wrath brings the punishment of the sword, that you may know there is a judgment.”"}, {"b": "Job", "c": 20, "v": 23, "t": "To fill his belly to the full, God will send his burning anger against him and rain it upon him into his body."}, {"b": "Job", "c": 20, "v": 28, "t": "The possessions of his house will be carried away, dragged off in the day of God's wrath."}, {"b": "Job", "c": 21, "v": 17, "t": "“How often is it that the lamp of the wicked is put out? That their calamity comes upon them? That God distributes pains in his anger?"}, {"b": "Job", "c": 21, "v": 20, "t": "Let their own eyes see their destruction, and let them drink of the wrath of the Almighty."}, {"b": "Job", "c": 21, "v": 30, "t": "that the evil man is spared in the day of calamity, that he is rescued in the day of wrath?"}, {"b": "Job", "c": 32, "v": 2, "t": "Then Elihu the son of Barachel the Buzite, of the family of Ram, burned with anger. He burned with anger at Job because he justified himself rather than God."}, {"b": "Job", "c": 32, "v": 3, "t": "He burned with anger also at Job's three friends because they had found no answer, although they had declared Job to be in the wrong."}, {"b": "Job", "c": 32, "v": 5, "t": "And when Elihu saw that there was no answer in the mouth of these three men, he burned with anger."}, {"b": "Job", "c": 35, "v": 15, "t": "And now, because his anger does not punish, and he does not take much note of transgression,"}, {"b": "Job", "c": 36, "v": 13, "t": "“The godless in heart cherish anger; they do not cry for help when he binds them."}, {"b": "Job", "c": 36, "v": 18, "t": "Beware lest wrath entice you into scoffing, and let not the greatness of the ransom turn you aside."}, {"b": "Job", "c": 39, "v": 24, "t": "With fierceness and rage he swallows the ground; he cannot stand still at the sound of the trumpet."}, {"b": "Job", "c": 40, "v": 11, "t": "Pour out the overflowings of your anger, and look on everyone who is proud and abase him."}, {"b": "Job", "c": 42, "v": 7, "t": "After the LORD had spoken these words to Job, the LORD said to Eliphaz the Temanite: “My anger burns against you and against your two friends, for you have not spoken of me what is right, as my servant Job has."}, {"b": "Psalms", "c": 2, "v": 1, "t": "Why do the nations rage and the peoples plot in vain?"}, {"b": "Psalms", "c": 2, "v": 5, "t": "Then he will speak to them in his wrath, and terrify them in his fury, saying,"}, {"b": "Psalms", "c": 2, "v": 12, "t": "Kiss the Son, lest he be angry, and you perish in the way, for his wrath is quickly kindled. Blessed are all who take refuge in him."}, {"b": "Psalms", "c": 4, "v": 4, "t": "Be angry, and do not sin; ponder in your own hearts on your beds, and be silent. Selah"}, {"b": "Psalms", "c": 6, "v": 1, "t": "O LORD, rebuke me not in your anger, nor discipline me in your wrath."}, {"b": "Psalms", "c": 7, "v": 6, "t": "Arise, O LORD, in your anger; lift yourself up against the fury of my enemies; awake for me; you have appointed a judgment."}, {"b": "Psalms", "c": 7, "v": 11, "t": "God is a righteous judge, and a God who feels indignation every day."}, {"b": "Psalms", "c": 18, "v": 7, "t": "Then the earth reeled and rocked; the foundations also of the mountains trembled and quaked, because he was angry."}, {"b": "Psalms", "c": 21, "v": 9, "t": "You will make them as a blazing oven when you appear. The LORD will swallow them up in his wrath, and fire will consume them."}, {"b": "Psalms", "c": 27, "v": 9, "t": "Hide not your face from me. Turn not your servant away in anger, O you who have been my help. Cast me not off; forsake me not, O God of my salvation!"}, {"b": "Psalms", "c": 30, "v": 5, "t": "For his anger is but for a moment, and his favor is for a lifetime. Weeping may tarry for the night, but joy comes with the morning."}, {"b": "Psalms", "c": 37, "v": 8, "t": "Refrain from anger, and forsake wrath! Fret not yourself; it tends only to evil."}, {"b": "Psalms", "c": 38, "v": 1, "t": "O LORD, rebuke me not in your anger, nor discipline me in your wrath!"}, {"b": "Psalms", "c": 38, "v": 3, "t": "There is no soundness in my flesh because of your indignation; there is no health in my bones because of my sin."}, {"b": "Psalms", "c": 46, "v": 6, "t": "The nations rage, the kingdoms totter; he utters his voice, the earth melts."}, {"b": "Psalms", "c": 55, "v": 3, "t": "because of the noise of the enemy, because of the oppression of the wicked. For they drop trouble upon me, and in anger they bear a grudge against me."}, {"b": "Psalms", "c": 55, "v": 8, "t": "I would hurry to find a shelter from the raging wind and tempest.”"}, {"b": "Psalms", "c": 56, "v": 7, "t": "For their crime will they escape? In wrath cast down the peoples, O God!"}, {"b": "Psalms", "c": 59, "v": 13, "t": "consume them in wrath; consume them till they are no more, that they may know that God rules over Jacob to the ends of the earth. Selah"}, {"b": "Psalms", "c": 60, "v": 1, "t": "O God, you have rejected us, broken our defenses; you have been angry; oh, restore us."}, {"b": "Psalms", "c": 69, "v": 24, "t": "Pour out your indignation upon them, and let your burning anger overtake them."}, {"b": "Psalms", "c": 74, "v": 1, "t": "O God, why do you cast us off forever? Why does your anger smoke against the sheep of your pasture?"}, {"b": "Psalms", "c": 76, "v": 7, "t": "But you, you are to be feared! Who can stand before you when once your anger is roused?"}, {"b": "Psalms", "c": 76, "v": 10, "t": "Surely the wrath of man shall praise you; the remnant of wrath you will put on like a belt."}, {"b": "Psalms", "c": 77, "v": 9, "t": "Has God forgotten to be gracious? Has he in anger shut up his compassion?” Selah"}, {"b": "Psalms", "c": 78, "v": 21, "t": "Therefore, when the LORD heard, he was full of wrath; a fire was kindled against Jacob; his anger rose against Israel,"}, {"b": "Psalms", "c": 78, "v": 31, "t": "the anger of God rose against them, and he killed the strongest of them and laid low the young men of Israel."}, {"b": "Psalms", "c": 78, "v": 38, "t": "Yet he, being compassionate, atoned for their iniquity and did not destroy them; he restrained his anger often and did not stir up all his wrath."}, {"b": "Psalms", "c": 78, "v": 41, "t": "They tested God again and again and provoked the Holy One of Israel."}, {"b": "Psalms", "c": 78, "v": 49, "t": "He let loose on them his burning anger, wrath, indignation, and distress, a company of destroying angels."}, {"b": "Psalms", "c": 78, "v": 50, "t": "He made a path for his anger; he did not spare them from death, but gave their lives over to the plague."}, {"b": "Psalms", "c": 78, "v": 58, "t": "For they provoked him to anger with their high places; they moved him to jealousy with their idols."}, {"b": "Psalms", "c": 78, "v": 59, "t": "When God heard, he was full of wrath, and he utterly rejected Israel."}, {"b": "Psalms", "c": 78, "v": 62, "t": "He gave his people over to the sword and vented his wrath on his heritage."}, {"b": "Psalms", "c": 79, "v": 5, "t": "How long, O LORD? Will you be angry forever? Will your jealousy burn like fire?"}, {"b": "Psalms", "c": 79, "v": 6, "t": "Pour out your anger on the nations that do not know you, and on the kingdoms that do not call upon your name!"}, {"b": "Psalms", "c": 80, "v": 4, "t": "O LORD God of hosts, how long will you be angry with your people's prayers?"}, {"b": "Psalms", "c": 85, "v": 3, "t": "You withdrew all your wrath; you turned from your hot anger."}, {"b": "Psalms", "c": 85, "v": 4, "t": "Restore us again, O God of our salvation, and put away your indignation toward us!"}, {"b": "Psalms", "c": 85, "v": 5, "t": "Will you be angry with us forever? Will you prolong your anger to all generations?"}, {"b": "Psalms", "c": 86, "v": 15, "t": "But you, O Lord, are a God merciful and gracious, slow to anger and abounding in steadfast love and faithfulness."}, {"b": "Psalms", "c": 88, "v": 7, "t": "Your wrath lies heavy upon me, and you overwhelm me with all your waves. Selah"}, {"b": "Psalms", "c": 88, "v": 16, "t": "Your wrath has swept over me; your dreadful assaults destroy me."}, {"b": "Psalms", "c": 89, "v": 9, "t": "You rule the raging of the sea; when its waves rise, you still them."}, {"b": "Psalms", "c": 89, "v": 38, "t": "But now you have cast off and rejected; you are full of wrath against your anointed."}, {"b": "Psalms", "c": 89, "v": 46, "t": "How long, O LORD? Will you hide yourself forever? How long will your wrath burn like fire?"}, {"b": "Psalms", "c": 90, "v": 7, "t": "For we are brought to an end by your anger; by your wrath we are dismayed."}, {"b": "Psalms", "c": 90, "v": 9, "t": "For all our days pass away under your wrath; we bring our years to an end like a sigh."}, {"b": "Psalms", "c": 90, "v": 11, "t": "Who considers the power of your anger, and your wrath according to the fear of you?"}, {"b": "Psalms", "c": 95, "v": 11, "t": "Therefore I swore in my wrath, “They shall not enter my rest.”"}, {"b": "Psalms", "c": 102, "v": 10, "t": "because of your indignation and anger; for you have taken me up and thrown me down."}, {"b": "Psalms", "c": 103, "v": 8, "t": "The LORD is merciful and gracious, slow to anger and abounding in steadfast love."}, {"b": "Psalms", "c": 103, "v": 9, "t": "He will not always c
