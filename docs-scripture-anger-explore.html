hide, nor will he keep his anger forever."}, {"b": "Psalms", "c": 106, "v": 23, "t": "Therefore he said he would destroy them — had not Moses, his chosen one, stood in the breach before him, to turn away his wrath from destroying them."}, {"b": "Psalms", "c": 106, "v": 29, "t": "they provoked the LORD to anger with their deeds, and a plague broke out among them."}, {"b": "Psalms", "c": 106, "v": 32, "t": "They angered him at the waters of Meribah, and it went ill with Moses on their account,"}, {"b": "Psalms", "c": 106, "v": 40, "t": "Then the anger of the LORD was kindled against his people, and he abhorred his heritage;"}, {"b": "Psalms", "c": 110, "v": 5, "t": "The Lord is at your right hand; he will shatter kings on the day of his wrath."}, {"b": "Psalms", "c": 112, "v": 10, "t": "The wicked man sees it and is angry; he gnashes his teeth and melts away; the desire of the wicked will perish!"}, {"b": "Psalms", "c": 119, "v": 53, "t": "Hot indignation seizes me because of the wicked, who forsake your law."}, {"b": "Psalms", "c": 124, "v": 3, "t": "then they would have swallowed us up alive, when their anger was kindled against us;"}, {"b": "Psalms", "c": 124, "v": 5, "t": "then over us would have gone the raging waters."}, {"b": "Psalms", "c": 138, "v": 7, "t": "Though I walk in the midst of trouble, you preserve my life; you stretch out your hand against the wrath of my enemies, and your right hand delivers me."}, {"b": "Psalms", "c": 145, "v": 8, "t": "The LORD is gracious and merciful, slow to anger and abounding in steadfast love."}, {"b": "Proverbs", "c": 6, "v": 34, "t": "For jealousy makes a man furious, and he will not spare when he takes revenge."}, {"b": "Proverbs", "c": 11, "v": 4, "t": "Riches do not profit in the day of wrath, but righteousness delivers from death."}, {"b": "Proverbs", "c": 11, "v": 23, "t": "The desire of the righteous ends only in good, the expectation of the wicked in wrath."}, {"b": "Proverbs", "c": 14, "v": 17, "t": "A man of quick temper acts foolishly, and a man of evil devices is hated."}, {"b": "Proverbs", "c": 14, "v": 29, "t": "Whoever is slow to anger has great understanding, but he who has a hasty temper exalts folly."}, {"b": "Proverbs", "c": 14, "v": 35, "t": "A servant who deals wisely has the king's favor, but his wrath falls on one who acts shamefully."}, {"b": "Proverbs", "c": 15, "v": 1, "t": "A soft answer turns away wrath, but a harsh word stirs up anger."}, {"b": "Proverbs", "c": 15, "v": 18, "t": "A hot-tempered man stirs up strife, but he who is slow to anger quiets contention."}, {"b": "Proverbs", "c": 16, "v": 14, "t": "A king's wrath is a messenger of death, and a wise man will appease it."}, {"b": "Proverbs", "c": 16, "v": 32, "t": "Whoever is slow to anger is better than the mighty, and he who rules his spirit than he who takes a city."}, {"b": "Proverbs", "c": 19, "v": 3, "t": "When a man's folly brings his way to ruin, his heart rages against the LORD."}, {"b": "Proverbs", "c": 19, "v": 11, "t": "Good sense makes one slow to anger, and it is his glory to overlook an offense."}, {"b": "Proverbs", "c": 19, "v": 12, "t": "A king's wrath is like the growling of a lion, but his favor is like dew on the grass."}, {"b": "Proverbs", "c": 19, "v": 19, "t": "A man of great wrath will pay the penalty, for if you deliver him, you will only have to do it again."}, {"b": "Proverbs", "c": 20, "v": 2, "t": "The terror of a king is like the growling of a lion; whoever provokes him to anger forfeits his life."}, {"b": "Proverbs", "c": 21, "v": 14, "t": "A gift in secret averts anger, and a concealed bribe, strong wrath."}, {"b": "Proverbs", "c": 22, "v": 8, "t": "Whoever sows injustice will reap calamity, and the rod of his fury will fail."}, {"b": "Proverbs", "c": 22, "v": 14, "t": "The mouth of forbidden women is a deep pit; he with whom the LORD is angry will fall into it."}, {"b": "Proverbs", "c": 22, "v": 24, "t": "Make no friendship with a man given to anger, nor go with a wrathful man,"}, {"b": "Proverbs", "c": 24, "v": 18, "t": "lest the LORD see it and be displeased, and turn away his anger from him."}, {"b": "Proverbs", "c": 25, "v": 23, "t": "The north wind brings forth rain, and a backbiting tongue, angry looks."}, {"b": "Proverbs", "c": 27, "v": 4, "t": "Wrath is cruel, anger is overwhelming, but who can stand before jealousy?"}, {"b": "Proverbs", "c": 29, "v": 8, "t": "Scoffers set a city aflame, but the wise turn away wrath."}, {"b": "Proverbs", "c": 29, "v": 9, "t": "If a wise man has an argument with a fool, the fool only rages and laughs, and there is no quiet."}, {"b": "Proverbs", "c": 29, "v": 22, "t": "A man of wrath stirs up strife, and one given to anger causes much transgression."}, {"b": "Proverbs", "c": 30, "v": 33, "t": "For pressing milk produces curds, pressing the nose produces blood, and pressing anger produces strife."}, {"b": "Ecclesiastes", "c": 5, "v": 6, "t": "Let not your mouth lead you into sin, and do not say before the messenger that it was a mistake. Why should God be angry at your voice and destroy the work of your hands?"}, {"b": "Ecclesiastes", "c": 5, "v": 17, "t": "Moreover, all his days he eats in darkness in much vexation and sickness and anger."}, {"b": "Ecclesiastes", "c": 7, "v": 9, "t": "Be not quick in your spirit to become angry, for anger lodges in the heart of fools."}, {"b": "Ecclesiastes", "c": 10, "v": 4, "t": "If the anger of the ruler rises against you, do not leave your place, for calmness will lay great offenses to rest."}, {"b": "Song of Solomon", "c": 1, "v": 6, "t": "Do not gaze at me because I am dark, because the sun has looked upon me. My mother's sons were angry with me; they made me keeper of the vineyards, but my own vineyard I have not kept!"}, {"b": "Isaiah", "c": 5, "v": 25, "t": "Therefore the anger of the LORD was kindled against his people, and he stretched out his hand against them and struck them, and the mountains quaked; and their corpses were as refuse in the midst of the streets. For all this his anger has not turned away, and his hand is stretched out still."}, {"b": "Isaiah", "c": 7, "v": 4, "t": "And say to him, ‘Be careful, be quiet, do not fear, and do not let your heart be faint because of these two smoldering stumps of firebrands, at the fierce anger of Rezin and Syria and the son of Remaliah."}, {"b": "Isaiah", "c": 8, "v": 21, "t": "They will pass through the land, greatly distressed and hungry. And when they are hungry, they will be enraged and will speak contemptuously against their king and their God, and turn their faces upward."}, {"b": "Isaiah", "c": 9, "v": 12, "t": "The Syrians on the east and the Philistines on the west devour Israel with open mouth. For all this his anger has not turned away, and his hand is stretched out still."}, {"b": "Isaiah", "c": 9, "v": 17, "t": "Therefore the Lord does not rejoice over their young men, and has no compassion on their fatherless and widows; for everyone is godless and an evildoer, and every mouth speaks folly. For all this his anger has not turned away, and his hand is stretched out still."}, {"b": "Isaiah", "c": 9, "v": 19, "t": "Through the wrath of the LORD of hosts the land is scorched, and the people are like fuel for the fire; no one spares another."}, {"b": "Isaiah", "c": 9, "v": 21, "t": "Manasseh devours Ephraim, and Ephraim devours Manasseh; together they are against Judah. For all this his anger has not turned away, and his hand is stretched out still."}, {"b": "Isaiah", "c": 10, "v": 4, "t": "Nothing remains but to crouch among the prisoners or fall among the slain. For all this his anger has not turned away, and his hand is stretched out still."}, {"b": "Isaiah", "c": 10, "v": 5, "t": "Woe to Assyria, the rod of my anger; the staff in their hands is my fury!"}, {"b": "Isaiah", "c": 10, "v": 6, "t": "Against a godless nation I send him, and against the people of my wrath I command him, to take spoil and seize plunder, and to tread them down like the mire of the streets."}, {"b": "Isaiah", "c": 10, "v": 25, "t": "For in a very little while my fury will come to an end, and my anger will be directed to their destruction."}, {"b": "Isaiah", "c": 12, "v": 1, "t": "You will say in that day: “I will give thanks to you, O LORD, for though you were angry with me, your anger turned away, that you might comfort me."}, {"b": "Isaiah", "c": 13, "v": 3, "t": "I myself have commanded my consecrated ones, and have summoned my mighty men to execute my anger, my proudly exulting ones."}, {"b": "Isaiah", "c": 13, "v": 5, "t": "They come from a distant land, from the end of the heavens, the LORD and the weapons of his indignation, to destroy the whole land."}, {"b": "Isaiah", "c": 13, "v": 9, "t": "Behold, the day of the LORD comes, cruel, with wrath and fierce anger, to make the land a desolation and to destroy its sinners from it."}, {"b": "Isaiah", "c": 13, "v": 13, "t": "Therefore I will make the heavens tremble, and the earth will be shaken out of its place, at the wrath of the LORD of hosts in the day of his fierce anger."}, {"b": "Isaiah", "c": 14, "v": 4, "t": "you will take up this taunt against the king of Babylon: “How the oppressor has ceased, the insolent fury ceased!"}, {"b": "Isaiah", "c": 14, "v": 6, "t": "that struck the peoples in wrath with unceasing blows, that ruled the nations in anger with unrelenting persecution."}, {"b": "Isaiah", "c": 26, "v": 20, "t": "Come, my people, enter your chambers, and shut your doors behind you; hide yourselves for a little while until the fury has passed by."}, {"b": "Isaiah", "c": 27, "v": 4, "t": "I have no wrath. Would that I had thorns and briers to battle! I would march against them, I would burn them up together."}, {"b": "Isaiah", "c": 30, "v": 27, "t": "Behold, the name of the LORD comes from afar, burning with his anger, and in thick rising smoke; his lips are full of fury, and his tongue is like a devouring fire;"}, {"b": "Isaiah", "c": 30, "v": 30, "t": "And the LORD will cause his majestic voice to be heard and the descending blow of his arm to be seen, in furious anger and a flame of devouring fire, with a cloudburst and storm and hailstones."}, {"b": "Isaiah", "c": 34, "v": 2, "t": "For the LORD is enraged against all the nations, and furious against all their host; he has devoted them to destruction, has given them over for slaughter."}, {"b": "Isaiah", "c": 37, "v": 28, "t": "“‘I know your sitting down and your going out and coming in, and your raging against me."}, {"b": "Isaiah", "c": 37, "v": 29, "t": "Because you have raged against me and your complacency has come to my ears, I will put my hook in your nose and my bit in your mouth, and I will turn you back on the way by which you came.’"}, {"b": "Isaiah", "c": 42, "v": 25, "t": "So he poured on him the heat of his anger and the might of battle; it set him on fire all around, but he did not understand; it burned him up, but he did not take it to heart."}, {"b": "Isaiah", "c": 47, "v": 6, "t": "I was angry with my people; I profaned my heritage; I gave them into your hand; you showed them no mercy; on the aged you made your yoke exceedingly heavy."}, {"b": "Isaiah", "c": 48, "v": 9, "t": "“For my name's sake I defer my anger; for the sake of my praise I restrain it for you, that I may not cut you off."}, {"b": "Isaiah", "c": 51, "v": 13, "t": "and have forgotten the LORD, your Maker, who stretched out the heavens and laid the foundations of the earth, and you fear continually all the day because of the wrath of the oppressor, when he sets himself to destroy? And where is the wrath of the oppressor?"}, {"b": "Isaiah", "c": 51, "v": 17, "t": "Wake yourself, wake yourself, stand up, O Jerusalem, you who have drunk from the hand of the LORD the cup of his wrath, who have drunk to the dregs the bowl, the cup of staggering."}, {"b": "Isaiah", "c": 51, "v": 20, "t": "Your sons have fainted; they lie at the head of every street like an antelope in a net; they are full of the wrath of the LORD, the rebuke of your God."}, {"b": "Isaiah", "c": 51, "v": 22, "t": "Thus says your Lord, the LORD, your God who pleads the cause of his people: “Behold, I have taken from your hand the cup of staggering; the bowl of my wrath you shall drink no more;"}, {"b": "Isaiah", "c": 54, "v": 8, "t": "In overflowing anger for a moment I hid my face from you, but with everlasting love I will have compassion on you,” says the LORD, your Redeemer."}, {"b": "Isaiah", "c": 54, "v": 9, "t": "“This is like the days of Noah to me: as I swore that the waters of Noah should no more go over the earth, so I have sworn that I will not be angry with you, and will not rebuke you."}, {"b": "Isaiah", "c": 57, "v": 16, "t": "For I will not contend forever, nor will I always be angry; for the spirit would grow faint before me, and the breath of life that I made."}, {"b": "Isaiah", "c": 57, "v": 17, "t": "Because of the iniquity of his unjust gain I was angry, I struck him; I hid my face and was angry, but he went on backsliding in the way of his own heart."}, {"b": "Isaiah", "c": 59, "v": 18, "t": "According to their deeds, so will he repay, wrath to his adversaries, repayment to his enemies; to the coastlands he will render repayment."}, {"b": "Isaiah", "c": 60, "v": 10, "t": "Foreigners shall build up your walls, and their kings shall minister to you; for in my wrath I struck you, but in my favor I have had mercy on you."}, {"b": "Isaiah", "c": 63, "v": 3, "t": "“I have trodden the winepress alone, and from the peoples no one was with me; I trod them in my anger and trampled them in my wrath; their lifeblood spattered on my garments, and stained all my apparel."}, {"b": "Isaiah", "c": 63, "v": 5, "t": "I looked, but there was no one to help; I was appalled, but there was no one to uphold; so my own arm brought me salvation, and my wrath upheld me."}, {"b": "Isaiah", "c": 63, "v": 6, "t": "I trampled down the peoples in my anger; I made them drunk in my wrath, and I poured out their lifeblood on the earth.”"}, {"b": "Isaiah", "c": 64, "v": 5, "t": "You meet him who joyfully works righteousness, those who remember you in your ways. Behold, you were angry, and we sinned; in our sins we have been a long time, and shall we be saved?"}, {"b": "Isaiah", "c": 64, "v": 9, "t": "Be not so terribly angry, O LORD, and remember not iniquity forever. Behold, please look, we are all your people."}, {"b": "Isaiah", "c": 65, "v": 3, "t": "a people who provoke me to my face continually, sacrificing in gardens and making offerings on bricks;"}, {"b": "Isaiah", "c": 66, "v": 14, "t": "You shall see, and your heart shall rejoice; your bones shall flourish like the grass; and the hand of the LORD shall be known to his servants, and he shall show his indignation against his enemies."}, {"b": "Isaiah", "c": 66, "v": 15, "t": "“For behold, the LORD will come in fire, and his chariots like the whirlwind, to render his anger in fury, and his rebuke with flames of fire."}, {"b": "Jeremiah", "c": 2, "v": 35, "t": "you say, ‘I am innocent; surely his anger has turned from me.’ Behold, I will bring you to judgment for saying, ‘I have not sinned.’"}, {"b": "Jeremiah", "c": 3, "v": 5, "t": "will he be angry forever, will he be indignant to the end?’ Behold, you have spoken, but you have done all the evil that you could.”"}, {"b": "Jeremiah", "c": 3, "v": 12, "t": "Go, and proclaim these words toward the north, and say, “‘Return, faithless Israel, declares the LORD. I will not look on you in anger, for I am merciful, declares the LORD; I will not be angry forever."}, {"b": "Jeremiah", "c": 4, "v": 4, "t": "Circumcise yourselves to the LORD; remove the foreskin of your hearts, O men of Judah and inhabitants of Jerusalem; lest my wrath go forth like fire, and burn with none to quench it, because of the evil of your deeds.”"}, {"b": "Jeremiah", "c": 4, "v": 8, "t": "For this put on sackcloth, lament and wail, for the fierce anger of the LORD has not turned back from us.”"}, {"b": "Jeremiah", "c": 4, "v": 26, "t": "I looked, and behold, the fruitful land was a desert, and all its cities were laid in ruins before the LORD, before his fierce anger."}, {"b": "Jeremiah", "c": 6, "v": 11, "t": "Therefore I am full of the wrath of the LORD; I am weary of holding it in. “Pour it out upon the children in the street, and upon the gatherings of young men, also; both husband and wife shall be taken, the elderly and the very aged."}, {"b": "Jeremiah", "c": 7, "v": 18, "t": "The children gather wood, the fathers kindle fire, and the women knead dough, to make cakes for the queen of heaven. And they pour out drink offerings to other gods, to provoke me to anger."}, {"b": "Jeremiah", "c": 7, "v": 19, "t": "Is it I whom they provoke? declares the LORD. Is it not themselves, to their own shame?"}, {"b": "Jeremiah", "c": 7, "v": 20, "t": "Therefore thus says the Lord GOD: Behold, my anger and my wrath will be poured out on this place, upon man and beast, upon the trees of the field and the fruit of the ground; it will burn and not be quenched.”"}, {"b": "Jeremiah", "c": 7, "v": 29, "t": "“‘Cut off your hair and cast it away; raise a lamentation on the bare heights, for the LORD has rejected and forsaken the generation of his wrath.’"}, {"b": "Jeremiah", "c": 8, "v": 19, "t": "Behold, the cry of the daughter of my people from the length and breadth of the land: “Is the LORD not in Zion? Is her King not in her?” “Why have they provoked me to anger with their carved images and with their foreign idols?”"}, {"b": "Jeremiah", "c": 10, "v": 10, "t": "But the LORD is the true God; he is the living God and the everlasting King. At his wrath the earth quakes, and the nations cannot endure his indignation."}, {"b": "Jeremiah", "c": 10, "v": 24, "t": "Correct me, O LORD, but in justice; not in your anger, lest you bring me to nothing."}, {"b": "Jeremiah", "c": 10, "v": 25, "t": "Pour out your wrath on the nations that know you not, and on the peoples that call not on your name, for they have devoured Jacob; they have devoured him and consumed him, and have laid waste his habitation."}, {"b": "Jeremiah", "c": 11, "v": 17, "t": "The LORD of hosts, who planted you, has decreed disaster against you, because of the evil that the house of Israel and the house of Judah have done, provoking me to anger by making offerings to Baal.”"}, {"b": "Jeremiah", "c": 12, "v": 13, "t": "They have sown wheat and have reaped thorns; they have tired themselves out but profit nothing. They shall be ashamed of their harvests because of the fierce anger of the LORD.”"}, {"b": "Jeremiah", "c": 15, "v": 14, "t": "I will make you serve your enemies in a land that you do not know, for in my anger a fire is kindled that shall burn forever.”"}, {"b": "Jeremiah", "c": 15, "v": 17, "t": "I did not sit in the company of revelers, nor did I rejoice; I sat alone, because your hand was upon me, for you had filled me with indignation."}, {"b": "Jeremiah", "c": 17, "v": 4, "t": "You shall loosen your hand from your heritage that I gave to you, and I will make you serve your enemies in a land that you do not know, for in my anger a fire is kindled that shall burn forever.”"}, {"b": "Jeremiah", "c": 18, "v": 20, "t": "Should good be repaid with evil? Yet they have dug a pit for my life. Remember how I stood before you to speak good for them, to turn away your wrath from them."}, {"b": "Jeremiah", "c": 18, "v": 23, "t": "Yet you, O LORD, know all their plotting to kill me. Forgive not their iniquity, nor blot out their sin from your sight. Let them be overthrown before you; deal with them in the time of your anger."}, {"b": "Jeremiah", "c": 21, "v": 5, "t": "I myself will fight against you with outstretched hand and strong arm, in anger and in fury and in great wrath."}, {"b": "Jeremiah", "c": 21, "v": 12, "t": "O house of David! Thus says the LORD: “‘Execute justice in the morning, and deliver from the hand of the oppressor him who has been robbed, lest my wrath go forth like fire, and burn with none to quench it, because of your evil deeds.’”"}, {"b": "Jeremiah", "c": 23, "v": 19, "t": "Behold, the storm of the LORD! Wrath has gone forth, a whirling tempest; it will burst upon the head of the wicked."}, {"b": "Jeremiah", "c": 23, "v": 20, "t": "The anger of the LORD will not turn back until he has executed and accomplished the intents of his heart. In the latter days you will understand it clearly."}, {"b": "Jeremiah", "c": 25, "v": 6, "t": "Do not go after other gods to serve and worship them, or provoke me to anger with the work of your hands. Then I will do you no harm.’"}, {"b": "Jeremiah", "c": 25, "v": 7, "t": "Yet you have not listened to me, declares the LORD, that you might provoke me to anger with the work of your hands to your own harm."}, {"b": "Jeremiah", "c": 25, "v": 15, "t": "Thus the LORD, the God of Israel, said to me: “Take from my hand this cup of the wine of wrath, and make all the nations to whom I send you drink it."}, {"b": "Jeremiah", "c": 25, "v": 37, "t": "and the peaceful folds are devastated because of the fierce anger of the LORD."}, {"b": "Jeremiah", "c": 25, "v": 38, "t": "Like a lion he has left his lair, for their land has become a waste because of the sword of the oppressor, and because of his fierce anger.”"}, {"b": "Jeremiah", "c": 30, "v": 23, "t": "Behold the storm of the LORD! Wrath has gone forth, a whirling tempest; it will burst upon the head of the wicked."}, {"b": "Jeremiah", "c": 30, "v": 24, "t": "The fierce anger of the LORD will not turn back until he has executed and accomplished the intentions of his mind. In the latter days you will understand this."}, {"b": "Jeremiah", "c": 32, "v": 29, "t": "The Chaldeans who are fighting against this city shall come and set this city on fire and burn it, with the houses on whose roofs offerings have been made to Baal and drink offerings have been poured out to other gods, to provoke me to anger."}, {"b": "Jeremiah", "c": 32, "v": 30, "t": "For the children of Israel and the children of Judah have done nothing but evil in my sight from their youth. The children of Israel have done nothing but provoke me to anger by the work of their hands, declares the LORD."}, {"b": "Jeremiah", "c": 32, "v": 31, "t": "This city has aroused my anger and wrath, from the day it was built to this day, so that I will remove it from my sight"}, {"b": "Jeremiah", "c": 32, "v": 32, "t": "because of all the evil of the children of Israel and the children of Judah that they did to provoke me to anger — their kings and their officials, their priests and their prophets, the men of Judah and the inhabitants of Jerusalem."}, {"b": "Jeremiah", "c": 32, "v": 37, "t": "Behold, I will gather them from all the countries to which I drove them in my anger and my wrath and in great indignation. I will bring them back to this place, and I will make them dwell in safety."}, {"b": "Jeremiah", "c": 33, "v": 5, "t": "They are coming in to fight against the Chaldeans and to fill them with the dead bodies of men whom I shall strike down in my anger and my wrath, for I have hidden my face from this city because of all their evil."}, {"b": "Jeremiah", "c": 36, "v": 7, "t": "It may be that their plea for mercy will come before the LORD, and that every one will turn from his evil way, for great is the anger and wrath that the LORD has pronounced against this people.”"}, {"b": "Jeremiah", "c": 37, "v": 15, "t": "And the officials were enraged at Jeremiah, and they beat him and imprisoned him in the house of Jonathan the secretary, for it had been made a prison."}, {"b": "Jeremiah", "c": 42, "v": 18, "t": "“For thus says the LORD of hosts, the God of Israel: As my anger and my wrath were poured out on the inhabitants of Jerusalem, so my wrath will be poured out on you when you go to Egypt. You shall become an execration, a horror, a curse, and a taunt. You shall see this place no more."}, {"b": "Jeremiah", "c": 44, "v": 3, "t": "because of the evil that they committed, provoking me to anger, in that they went to make offerings and serve other gods that they knew not, neither they, nor you, nor your fathers."}, {"b": "Jeremiah", "c": 44, "v": 6, "t": "Therefore my wrath and my anger were poured out and kindled in the cities of Judah and in the streets of Jerusalem, and they became a waste and a desolation, as at this day."}, {"b": "Jeremiah", "c": 44, "v": 8, "t": "Why do you provoke me to anger with the works of your hands, making offerings to other gods in the land of Egypt where you have come to live, so that you may be cut off and become a curse and a taunt among all the nations of the earth?"}, {"b": "Jeremiah", "c": 46, "v": 9, "t": "Advance, O horses, and rage, O chariots! Let the warriors go out: men of Cush and Put who handle the shield, men of Lud, skilled in handling the bow."}, {"b": "Jeremiah", "c": 49, "v": 37, "t": "I will terrify Elam before their enemies and before those who seek their life. I will bring disaster upon them, my fierce anger, declares the LORD. I will send the sword after them, until I have consumed them,"}, {"b": "Jeremiah", "c": 50, "v": 13, "t": "Because of the wrath of the LORD she shall not be inhabited but shall be an utter desolation; everyone who passes by Babylon shall be appalled, and hiss because of all her wounds."}, {"b": "Jeremiah", "c": 50, "v": 25, "t": "The LORD has opened his armory and brought out the weapons of his wrath, for the Lord GOD of hosts has a work to do in the land of the Chaldeans."}, {"b": "Jeremiah", "c": 51, "v": 45, "t": "“Go out of the midst of her, my people! Let every one save his life from the fierce anger of the LORD!"}, {"b": "Jeremiah", "c": 52, "v": 3, "t": "For because of the anger of the LORD it came to the point in Jerusalem and Judah that he cast them out from his presence. And Zedekiah rebelled against the king of Babylon."}, {"b": "Lamentations", "c": 1, "v": 12, "t": "“Is it nothing to you, all you who pass by? Look and see if there is any sorrow like my sorrow, which was brought upon me, which the LORD inflicted on the day of his fierce anger."}, {"b": "Lamentations", "c": 2, "v": 1, "t": "How the Lord in his anger has set the daughter of Zion under a cloud! He has cast down from heaven to earth the splendor of Israel; he has not remembered his footstool in the day of his anger."}, {"b": "Lamentations", "c": 2, "v": 2, "t": "The Lord has swallowed up without mercy all the habitations of Jacob; in his wrath he has broken down the strongholds of the daughter of Judah; he has brought down to the ground in dishonor the kingdom and its rulers."}, {"b": "Lamentations", "c": 2, "v": 3, "t": "He has cut down in fierce anger all the might of Israel; he has withdrawn from them his right hand in the face of the enemy; he has burned like a flaming fire in Jacob, consuming all around."}, {"b": "Lamentations", "c": 2, "v": 4, "t": "He has bent his bow like an enemy, with his right hand set like a foe; and he has killed all who were delightful in our eyes in the tent of the daughter of Zion; he has poured out his fury like fire."}, {"b": "Lamentations", "c": 2, "v": 6, "t": "He has laid waste his booth like a garden, laid in ruins his meeting place; the LORD has made Zion forget festival and Sabbath, and in his fierce indignation has spurned king and priest."}, {"b": "Lamentations", "c": 2, "v": 21, "t": "In the dust of the streets lie the young and the old; my young women and my young men have fallen by the sword; you have killed them in the day of your anger, slaughtering without pity."}, {"b": "Lamentations", "c": 2, "v": 22, "t": "You summoned as if to a festival day my terrors on every side, and on the day of the anger of the LORD no one escaped or survived; those whom I held and raised my enemy destroyed."}, {"b": "Lamentations", "c": 3, "v": 1, "t": "I am the man who has seen affliction under the rod of his wrath;"}, {"b": "Lamentations", "c": 3, "v": 43, "t": "“You have wrapped yourself with anger and pursued us, killing without pity;"}, {"b": "Lamentations", "c": 3, "v": 66, "t": "You will pursue them in anger and destroy them from under your heavens, O LORD.”"}, {"b": "Lamentations", "c": 4, "v": 11, "t": "The LORD gave full vent to his wrath; he poured out his hot anger, and he kindled a fire in Zion that consumed its foundations."}, {"b": "Lamentations", "c": 5, "v": 22, "t": "unless you have utterly rejected us, and you remain exceedingly angry with us."}, {"b": "Ezekiel", "c": 5, "v": 13, "t": "“Thus shall my anger spend itself, and I will vent my fury upon them and satisfy myself. And they shall know that I am the LORD — that I have spoken in my jealousy — when I spend my fury upon them."}, {"b": "Ezekiel", "c": 5, "v": 15, "t": "You shall be a reproach and a taunt, a warning and a horror, to the nations all around you, when I execute judgments on you in anger and fury, and with furious rebukes — I am the LORD; I have spoken —"}, {"b": "Ezekiel", "c": 6, "v": 12, "t": "He who is far off shall die of pestilence, and he who is near shall fall by the sword, and he who is left and is preserved shall die of famine. Thus I will spend my fury upon them."}, {"b": "Ezekiel", "c": 7, "v": 3, "t": "Now the end is upon you, and I will send my anger upon you; I will judge you according to your ways, and I will punish you for all your abominations."}, {"b": "Ezekiel", "c": 7, "v": 8, "t": "Now I will soon pour out my wrath upon you, and spend my anger against you, and judge you according to your ways, and I will punish you for all your abominations."}, {"b": "Ezekiel", "c": 7, "v": 12, "t": "The time has come; the day has arrived. Let not the buyer rejoice, nor the seller mourn, for wrath is upon all their multitude."}, {"b": "Ezekiel", "c": 7, "v": 14, "t": "“They have blown the trumpet and made everything ready, but none goes to battle, for my wrath is upon all their multitude."}, {"b": "Ezekiel", "c": 7, "v": 19, "t": "They cast their silver into the streets, and their gold is like an unclean thing. Their silver and gold are not able to deliver them in the day of the wrath of the LORD. They cannot satisfy their hunger or fill their stomachs with it. For it was the stumbling block of their iniquity."}, {"b": "Ezekiel", "c": 8, "v": 3, "t": "He put out the form of a hand and took me by a lock of my head, and the Spirit lifted me up between earth and heaven and brought me in visions of God to Jerusalem, to the entrance of the gateway of the inner court that faces north, where was the seat of the image of jealousy, which provokes to jealousy."}, {"b": "Ezekiel", "c": 8, "v": 17, "t": "Then he said to me, “Have you seen this, O son of man? Is it too light a thing for the house of Judah to commit the abominations that they commit here, that they should fill the land with violence and provoke me still further to anger? Behold, they put the branch to their nose."}, {"b": "Ezekiel", "c": 8, "v": 18, "t": "Therefore I will act in wrath. My eye will not spare, nor will I have pity. And though they cry in my ears with a loud voice, I will not hear them.”"}, {"b": "Ezekiel", "c": 9, "v": 8, "t": "And while they were striking, and I was left alone, I fell upon my face, and cried, “Ah, Lord GOD! Will you destroy all the remnant of Israel in the outpouring of your wrath on Jerusalem?”"}, {"b": "Ezekiel", "c": 13, "v": 13, "t": "Therefore thus says the Lord GOD: I will make a stormy wind break out in my wrath, and there shall be a deluge of rain in my anger, and great hailstones in wrath to make a full end."}, {"b": "Ezekiel", "c": 13, "v": 15, "t": "Thus will I spend my wrath upon the wall and upon those who have smeared it with whitewash, and I will say to you, The wall is no more, nor those who smeared it,"}, {"b": "Ezekiel", "c": 14, "v": 19, "t": "“Or if I send a pestilence into that land and pour out my wrath upon it with blood, to cut off from it man and beast,"}, {"b": "Ezekiel", "c": 16, "v": 26, "t": "You also played the whore with the Egyptians, your lustful neighbors, multiplying your whoring, to provoke me to anger."}, {"b": "Ezekiel", "c": 16, "v": 38, "t": "And I will judge you as women who commit adultery and shed blood are judged, and bring upon you the blood of wrath and jealousy."}, {"b": "Ezekiel", "c": 16, "v": 42, "t": "So will I satisfy my wrath on you, and my jealousy shall depart from you. I will be calm and will no more be angry."}, {"b": "Ezekiel", "c": 16, "v": 43, "t": "Because you have not remembered the days of your youth, but have enraged me with all these things, therefore, behold, I have returned your deeds upon your head, declares the Lord GOD. Have you not committed lewdness in addition to all your abominations?"}, {"b": "Ezekiel", "c": 19, "v": 12, "t": "But the vine was plucked up in fury, cast down to the ground; the east wind dried up its fruit; they were stripped off and withered. As for its strong stem, fire consumed it."}, {"b": "Ezekiel", "c": 20, "v": 8, "t": "But they rebelled against me and were not willing to listen to me. None of them cast away the detestable things their eyes feasted on, nor did they forsake the idols of Egypt. “Then I said I would pour out my wrath upon them and spend my anger against them in the midst of the land of Egypt."}, {"b": "Ezekiel", "c": 20, "v": 13, "t": "But the house of Israel rebelled against me in the wilderness. They did not walk in my statutes but rejected my rules, by which, if a person does them, he shall live; and my Sabbaths they greatly profaned. “Then I said I would pour out my wrath upon them in the wilderness, to make a full end of them."}, {"b": "Ezekiel", "c": 20, "v": 21, "t": "But the children rebelled against me. They did not walk in my statutes and were not careful to obey my rules, by which, if a person does them, he shall live; they profaned my Sabbaths. “Then I said I would pour out my wrath upon them and spend my anger against them in the wilderness."}, {"b": "Ezekiel", "c": 20, "v": 33, "t": "“As I live, declares the Lord GOD, surely with a mighty hand and an outstretched arm and with wrath poured out I will be king over you."}, {"b": "Ezekiel", "c": 20, "v": 34, "t": "I will bring you out from the peoples and gather you out of the countries where you are scattered, with a mighty hand and an outstretched arm, and with wrath poured out."}, {"b": "Ezekiel", "c": 21, "v": 17, "t": "I also will clap my hands, and I will satisfy my fury; I the LORD have spoken.”"}, {"b": "Ezekiel", "c": 21, "v": 31, "t": "And I will pour out my indignation upon you; I will blow upon you with the fire of my wrath, and I will deliver you into the hands of brutish men, skillful to destroy."}, {"b": "Ezekiel", "c": 22, "v": 20, "t": "As one gathers silver and bronze and iron and lead and tin into a furnace, to blow the fire on it in order to melt it, so I will gather you in my anger and in my wrath, and I will put you in and melt you."}, {"b": "Ezekiel", "c": 22, "v": 21, "t": "I will gather you and blow on you with the fire of my wrath, and you shall be melted in the midst of it."}, {"b": "Ezekiel", "c": 22, "v": 22, "t": "As silver is melted in a furnace, so you shall be melted in the midst of it, and you shall know that I am the LORD; I have poured out my wrath upon you.”"}, {"b": "Ezekiel", "c": 22, "v": 24, "t": "“Son of man, say to her, You are a land that is not cleansed or rained upon in the day of indignation."}, {"b": "Ezekiel", "c": 22, "v": 31, "t": "Therefore I have poured out my indignation upon them. I have consumed them with the fire of my wrath. I have returned their way upon their heads, declares the Lord GOD.”"}, {"b": "Ezekiel", "c": 23, "v": 25, "t": "And I will direct my jealousy against you, that they may deal with you in fury. They shall cut off your nose and your ears, and your survivors shall fall by the sword. They shall seize your sons and your daughters, and your survivors shall be devoured by fire."}, {"b": "Ezekiel", "c": 24, "v": 8, "t": "To rouse my wrath, to take vengeance, I have set on the bare rock the blood she has shed, that it may not be covered."}, {"b": "Ezekiel", "c": 24, "v": 13, "t": "On account of your unclean lewdness, because I would have cleansed you and you were not cleansed from your uncleanness, you shall not be cleansed anymore till I have satisfied my fury upon you."}, {"b": "Ezekiel", "c": 25, "v": 14, "t": "And I will lay my vengeance upon Edom by the hand of my people Israel, and they shall do in Edom according to my anger and according to my wrath, and they shall know my vengeance, declares the Lord GOD."}, {"b": "Ezekiel", "c": 25, "v": 17, "t": "I will execute great vengeance on them with wrathful rebukes. Then they will know that I am the LORD, when I lay my vengeance upon them.”"}, {"b": "Ezekiel", "c": 30, "v": 15, "t": "And I will pour out my wrath on Pelusium, the stronghold of Egypt, and cut off the multitude of Thebes."}, {"b": "Ezekiel", "c": 35, "v": 11, "t": "therefore, as I live, declares the Lord GOD, I will deal with you according to the anger and envy that you showed because of your hatred against them. And I will make myself known among them, when I judge you."}, {"b": "Ezekiel", "c": 36, "v": 6, "t": "Therefore prophesy concerning the land of Israel, and say to the mountains and hills, to the ravines and valleys, Thus says the Lord GOD: Behold, I have spoken in my jealous wrath, because you have suffered the reproach of the nations."}, {"b": "Ezekiel", "c": 36, "v": 18, "t": "So I poured out my wrath upon them for the blood that they had shed in the land, for the idols with which they had defiled it."}, {"b": "Ezekiel", "c": 38, "v": 18, "t": "But on that day, the day that Gog shall come against the land of Israel, declares the Lord GOD, my wrath will be roused in my anger."}, {"b": "Ezekiel", "c": 38, "v": 19, "t": "For in my jealousy and in my blazing wrath I declare, On that day there shall be a great earthquake in the land of Israel."}, {"b": "Ezekiel", "c": 43, "v": 8, "t": "by setting their threshold by my threshold and their doorposts beside my doorposts, with only a wall between me and them. They have defiled my holy name by their abominations that they have committed, so I have consumed them in my anger."}, {"b": "Daniel", "c": 2, "v": 12, "t": "Because of this the king was angry and very furious, and commanded that all the wise men of Babylon be destroyed."}, {"b": "Daniel", "c": 3, "v": 13, "t": "Then Nebuchadnezzar in furious rage commanded that Shadrach, Meshach, and Abednego be brought. So they brought these men before the king."}, {"b": "Daniel", "c": 3, "v": 19, "t": "Then Nebuchadnezzar was filled with fury, and the expression of his face was changed against Shadrach, Meshach, and Abednego. He ordered the furnace heated seven times more than it was usually heated."}, {"b": "Daniel", "c": 8, "v": 6, "t": "He came to the ram with the two horns, which I had seen standing on the bank of the canal, and he ran at him in his powerful wrath."}, {"b": "Daniel", "c": 8, "v": 7, "t": "I saw him come close to the ram, and he was enraged against him and struck the ram and broke his two horns. And the ram had no power to stand before him, but he cast him down to the ground and trampled on him. And there was no one who could rescue the ram from his power."}, {"b": "Daniel", "c": 8, "v": 19, "t": "He said, “Behold, I will make known to you what shall be at the latter end of the indignation, for it refers to the appointed time of the end."}, {"b": "Daniel", "c": 9, "v": 16, "t": "“O Lord, according to all your righteous acts, let your anger and your wrath turn away from your city Jerusalem, your holy hill, because for our sins, and for the iniquities of our fathers, Jerusalem and your people have become a byword among all who are around us."}, {"b": "Daniel", "c": 11, "v": 11, "t": "Then the king of the south, moved with rage, shall come out and fight against the king of the north. And he shall raise a great multitude, but it shall be given into his hand."}, {"b": "Daniel", "c": 11, "v": 20, "t": "“Then shall arise in his place one who shall send an exactor of tribute for the glory of the kingdom. But within a few days he shall be broken, neither in anger nor in battle."}, {"b": "Daniel", "c": 11, "v": 30, "t": "For ships of Kittim shall come against him, and he shall be afraid and withdraw, and shall turn back and be enraged and take action against the holy covenant. He shall turn back and pay attention to those who forsake the holy covenant."}, {"b": "Daniel", "c": 11, "v": 36, "t": "“And the king shall do as he wills. He shall exalt himself and magnify himself above every god, and shall speak astonishing things against the God of gods. He shall prosper till the indignation is accomplished; for what is decreed shall be done."}, {"b": "Daniel", "c": 11, "v": 44, "t": "But news from the east and the north shall alarm him, and he shall go out with great fury to destroy and devote many to destruction."}, {"b": "Hosea", "c": 5, "v": 10, "t": "The princes of Judah have become like those who move the landmark; upon them I will pour out my wrath like water."}, {"b": "Hosea", "c": 7, "v": 6, "t": "For with hearts like an oven they approach their intrigue; all night their anger smolders; in the morning it blazes like a flaming fire."}, {"b": "Hosea", "c": 8, "v": 5, "t": "I have spurned your calf, O Samaria. My anger burns against them. How long will they be incapable of innocence?"}, {"b": "Hosea", "c": 11, "v": 6, "t": "The sword shall rage against their cities, consume the bars of their gates, and devour them because of their own counsels."}, {"b": "Hosea", "c": 11, "v": 9, "t": "I will not execute my burning anger; I will not again destroy Ephraim; for I am God and not a man, the Holy One in your midst, and I will not come in wrath."}, {"b": "Hosea", "c": 13, "v": 11, "t": "I gave you a king in my anger, and I took him away in my wrath."}, {"b": "Hosea", "c": 14, "v": 4, "t": "I will heal their apostasy; I will love them freely, for my anger has turned from them."}, {"b": "Joel", "c": 2, "v": 13, "t": "and rend your hearts and not your garments.” Return to the LORD your God, for he is gracious and merciful, slow to anger, and abounding in steadfast love; and he relents over disaster."}, {"b": "Amos", "c": 1, "v": 11, "t": "Thus says the LORD: “For three transgressions of Edom, and for four, I will not revoke the punishment, because he pursued his brother with the sword and cast off all pity, and his anger tore perpetually, and he kept his wrath forever."}, {"b": "Jonah", "c": 1, "v": 15, "t": "So they picked up Jonah and hurled him into the sea, and the sea ceased from its raging."}, {"b": "Jonah", "c": 3, "v": 9, "t": "Who knows? God may turn and relent and turn from his fierce anger, so that we may not perish.”"}, {"b": "Jonah", "c": 4, "v": 1, "t": "But it displeased Jonah exceedingly, and he was angry."}, {"b": "Jonah", "c": 4, "v": 2, "t": "And he prayed to the LORD and said, “O LORD, is not this what I said when I was yet in my country? That is why I made haste to flee to Tarshish; for I knew that you are a gracious God and merciful, slow to anger and abounding in steadfast love, and relenting from disaster."}, {"b": "Jonah", "c": 4, "v": 4, "t": "And the LORD said, “Do you do well to be angry?”"}, {"b": "Jonah", "c": 4, "v": 9, "t": "But God said to Jonah, “Do you do well to be angry for the plant?” And he said, “Yes, I do well to be angry, angry enough to die.”"}, {"b": "Micah", "c": 5, "v": 15, "t": "And in anger and wrath I will execute vengeance on the nations that did not obey."}, {"b": "Micah", "c": 7, "v": 9, "t": "I will bear the indignation of the LORD because I have sinned against him, until he pleads my cause and executes judgment for me. He will bring me out to the light; I shall look upon his vindication."}, {"b": "Micah", "c": 7, "v": 18, "t": "Who is a God like you, pardoning iniquity and passing over transgression for the remnant of his inheritance? He does not retain his anger forever, because he delights in steadfast love."}, {"b": "Nahum", "c": 1, "v": 2, "t": "The LORD is a jealous and avenging God; the LORD is avenging and wrathful; the LORD takes vengeance on his adversaries and keeps wrath for his enemies."}, {"b": "Nahum", "c": 1, "v": 3, "t": "The LORD is slow to anger and great in power, and the LORD will by no means clear the guilty. His way is in whirlwind and storm, and the clouds are the dust of his feet."}, {"b": "Nahum", "c": 1, "v": 6, "t": "Who can stand before his indignation? Who can endure the heat of his anger? His wrath is poured out like fire, and the rocks are broken into pieces by him."}, {"b": "Habakkuk", "c": 2, "v": 15, "t": "“Woe to him who makes his neighbors drink — you pour out your wrath and make them drunk, in order to gaze at their nakedness!"}, {"b": "Habakkuk", "c": 3, "v": 2, "t": "O LORD, I have heard the report of you, and your work, O LORD, do I fear. In the midst of the years revive it; in the midst of the years make it known; in wrath remember mercy."}, {"b": "Habakkuk", "c": 3, "v": 8, "t": "Was your wrath against the rivers, O LORD? Was your anger against the rivers, or your indignation against the sea, when you rode on your horses, on your chariot of salvation?"}, {"b": "Habakkuk", "c": 3, "v": 10, "t": "The mountains saw you and writhed; the raging waters swept on; the deep gave forth its voice; it lifted its hands on high."}, {"b": "Habakkuk", "c": 3, "v": 12, "t": "You marched through the earth in fury; you threshed the nations in anger."}, {"b": "Zephaniah", "c": 1, "v": 15, "t": "A day of wrath is that day, a day of distress and anguish, a day of ruin and devastation, a day of darkness and gloom, a day of clouds and thick darkness,"}, {"b": "Zephaniah", "c": 1, "v": 18, "t": "Neither their silver nor their gold shall be able to deliver them on the day of the wrath of the LORD. In the fire of his jealousy, all the earth shall be consumed; for a full and sudden end he will make of all the inhabitants of the earth."}, {"b": "Zephaniah", "c": 2, "v": 2, "t": "before the decree takes effect — before the day passes away like chaff — before there comes upon you the burning anger of the LORD, before there comes upon you the day of the anger of the LORD."}, {"b": "Zephaniah", "c": 2, "v": 3, "t": "Seek the LORD, all you humble of the land, who do his just commands; seek righteousness; seek humility; perhaps you may be hidden on the day of the anger of the LORD."}, {"b": "Zephaniah", "c": 3, "v": 8, "t": "“Therefore wait for me,” declares the LORD, “for the day when I rise up to seize the prey. For my decision is to gather nations, to assemble kingdoms, to pour out upon them my indignation, all my burning anger; for in the fire of my jealousy all the earth shall be consumed."}, {"b": "Zechariah", "c": 1, "v": 2, "t": "“The LORD was very angry with your fathers."}, {"b": "Zechariah", "c": 1, "v": 12, "t": "Then the angel of the LORD said, ‘O LORD of hosts, how long will you have no mercy on Jerusalem and the cities of Judah, against which you have been angry these seventy years?’"}, {"b": "Zechariah", "c": 1, "v": 15, "t": "And I am exceedingly angry with the nations that are at ease; for while I was angry but a little, they furthered the disaster."}, {"b": "Zechariah", "c": 7, "v": 12, "t": "They made their hearts diamond-hard lest they should hear the law and the words that the LORD of hosts had sent by his Spirit through the former prophets. Therefore great anger came from the LORD of hosts."}, {"b": "Zechariah", "c": 8, "v": 2, "t": "“Thus says the LORD of hosts: I am jealous for Zion with great jealousy, and I am jealous for her with great wrath."}, {"b": "Zechariah", "c": 8, "v": 14, "t": "For thus says the LORD of hosts: “As I purposed to bring disaster to you when your fathers provoked me to wrath, and I did not relent, says the LORD of hosts,"}, {"b": "Zechariah", "c": 10, "v": 3, "t": "“My anger is hot against the shepherds, and I will punish the leaders; for the LORD of hosts cares for his flock, the house of Judah, and will make them like his majestic steed in battle."}, {"b": "Malachi", "c": 1, "v": 4, "t": "If Edom says, “We are shattered but we will rebuild the ruins,” the LORD of hosts says, “They may build, but I will tear down, and they will be called ‘the wicked country,’ and ‘the people with whom the LORD is angry forever.’”"}, {"b": "Matthew", "c": 2, "v": 16, "t": "Then Herod, when he saw that he had been tricked by the wise men, became furious, and he sent and killed all the male children in Bethlehem and in all that region who were two years old or under, according to the time that he had ascertained from the wise men."}, {"b": "Matthew", "c": 3, "v": 7, "t": "But when he saw many of the Pharisees and Sadducees coming to his baptism, he said to them, “You brood of vipers! Who warned you to flee from the wrath to come?"}, {"b": "Matthew", "c": 5, "v": 22, "t": "But I say to you that everyone who is angry with his brother will be liable to judgment; whoever insults his brother will be liable to the council; and whoever says, ‘You fool!’ will be liable to the hell of fire."}, {"b": "Matthew", "c": 18, "v": 34, "t": "And in anger his master delivered him to the jailers, until he should pay all his debt."}, {"b": "Matthew", "c": 20, "v": 24, "t": "And when the ten heard it, they were indignant at the two brothers."}, {"b": "Matthew", "c": 21, "v": 15, "t": "But when the chief priests and the scribes saw the wonderful things that he did, and the children crying out in the temple, “Hosanna to the Son of David!” they were indignant,"}, {"b": "Matthew", "c": 22, "v": 7, "t": "The king was angry, and he sent his troops and destroyed those murderers and burned their city."}, {"b": "Matthew", "c": 26, "v": 8, "t": "And when the disciples saw it, they were indignant, saying, “Why this waste?"}, {"b": "Mark", "c": 3, "v": 5, "t": "And he looked around at them with anger, grieved at their hardness of heart, and said to the man, “Stretch out your hand.” He stretched it out, and his hand was restored."}, {"b": "Mark", "c": 10, "v": 14, "t": "But when Jesus saw it, he was indignant and said to them, “Let the children come to me; do not hinder them, for to such belongs the kingdom of God."}, {"b": "Mark", "c": 10, "v": 41, "t": "And when the ten heard it, they began to be indignant at James and John."}, {"b": "Luke", "c": 3, "v": 7, "t": "He said therefore to the crowds that came out to be baptized by him, “You brood of vipers! Who warned you to flee from the wrath to come?"}, {"b": "Luke", "c": 4, "v": 28, "t": "When they heard these things, all in the synagogue were filled with wrath."}, {"b": "Luke", "c": 6, "v": 11, "t": "But they were filled with fury and discussed with one another what they might do to Jesus."}, {"b": "Luke", "c": 8, "v": 24, "t": "And they went and woke him, saying, “Master, Master, we are perishing!” And he awoke and rebuked the wind and the raging waves, and they ceased, and there was a calm."}, {"b": "Luke", "c": 11, "v": 53, "t": "As he went away from there, the scribes and the Pharisees began to press him hard and to provoke him to speak about many things,"}, {"b": "Luke", "c": 13, "v": 14, "t": "But the ruler of the synagogue, indignant because Jesus had healed on the Sabbath, said to the people, “There are six days in which work ought to be done. Come on those days and be healed, and not on the Sabbath day.”"}, {"b": "Luke", "c": 14, "v": 21, "t": "So the servant came and reported these things to his master. Then the master of the house became angry and said to his servant, ‘Go out quickly to the streets and lanes of the city, and bring in the poor and crippled and blind and lame.’"}, {"b": "Luke", "c": 15, "v": 28, "t": "But he was angry and refused to go in. His father came out and entreated him,"}, {"b": "Luke", "c": 21, "v": 23, "t": "Alas for women who are pregnant and for those who are nursing infants in those days! For there will be great distress upon the earth and wrath against this people."}, {"b": "John", "c": 3, "v": 36, "t": "Whoever believes in the Son has eternal life; whoever does not obey the Son shall not see life, but the wrath of God remains on him."}, {"b": "John", "c": 7, "v": 23, "t": "If on the Sabbath a man receives circumcision, so that the law of Moses may not be broken, are you angry with me because on the Sabbath I made a man's whole body well?"}, {"b": "Acts", "c": 4, "v": 25, "t": "who through the mouth of our father David, your servant, said by the Holy Spirit, “‘Why did the Gentiles rage, and the peoples plot in vain?"}, {"b": "Acts", "c": 5, "v": 33, "t": "When they heard this, they were enraged and wanted to kill them."}, {"b": "Acts", "c": 7, "v": 54, "t": "Now when they heard these things they were enraged, and they ground their teeth at him."}, {"b": "Acts", "c": 12, "v": 20, "t": "Now Herod was angry with the people of Tyre and Sidon, and they came to him with one accord, and having persuaded Blastus, the king's chamberlain, they asked for peace, because their country depended on the king's country for food."}, {"b": "Acts", "c": 17, "v": 16, "t": "Now while Paul was waiting for them at Athens, his spirit was provoked within him as he saw that the city was full of idols."}, {"b": "Acts", "c": 19, "v": 28, "t": "When they heard this they were enraged and were crying out, “Great is Artemis of the Ephesians!”"}, {"b": "Acts", "c": 26, "v": 11, "t": "And I punished them often in all the synagogues and tried to make them blaspheme, and in raging fury against them I persecuted them even to foreign cities."}, {"b": "Romans", "c": 1, "v": 18, "t": "For the wrath of God is revealed from heaven against all ungodliness and unrighteousness of men, who by their unrighteousness suppress the truth."}, {"b": "Romans", "c": 2, "v": 5, "t": "But because of your hard and impenitent heart you are storing up wrath for yourself on the day of wrath when God's righteous judgment will be revealed."}, {"b": "Romans", "c": 2, "v": 8, "t": "but for those who are self-seeking and do not obey the truth, but obey unrighteousness, there will be wrath and fury."}, {"b": "Romans", "c": 3, "v": 5, "t": "But if our unrighteousness serves to show the righteousness of God, what shall we say? That God is unrighteous to inflict wrath on us? (I speak in a human way.)"}, {"b": "Romans", "c": 4, "v": 15, "t": "For the law brings wrath, but where there is no law there is no transgression."}, {"b": "Romans", "c": 5, "v": 9, "t": "Since, therefore, we have now been justified by his blood, much more shall we be saved by him from the wrath of God."}, {"b": "Romans", "c": 9, "v": 22, "t": "What if God, desiring to show his wrath and to make known his power, has endured with much patience vessels of wrath prepared for destruction,"}, {"b": "Romans", "c": 10, "v": 19, "t": "But I ask, did Israel not understand? First Moses says, “I will make you jealous of those who are not a nation; with a foolish nation I will make you angry.”"}, {"b": "Romans", "c": 12, "v": 19, "t": "Beloved, never avenge yourselves, but leave it to the wrath of God, for it is written, “Vengeance is mine, I will repay, says the Lord.”"}, {"b": "Romans", "c": 13, "v": 4, "t": "for he is God's servant for your good. But if you do wrong, be afraid, for he does not bear the sword in vain. For he is the servant of God, an avenger who carries out God's wrath on the wrongdoer."}, {"b": "Romans", "c": 13, "v": 5, "t": "Therefore one must be in subjection, not only to avoid God's wrath but also for the sake of conscience."}, {"b": "1 Corinthians", "c": 10, "v": 22, "t": "Shall we provoke the Lord to jealousy? Are we stronger than he?"}, {"b": "2 Corinthians", "c": 7, "v": 11, "t": "For see what earnestness this godly grief has produced in you, but also what eagerness to clear yourselves, what indignation, what fear, what longing, what zeal, what punishment! At every point you have proved yourselves innocent in the matter."}, {"b": "2 Corinthians", "c": 11, "v": 29, "t": "Who is weak, and I am not weak? Who is made to fall, and I am not indignant?"}, {"b": "2 Corinthians", "c": 12, "v": 20, "t": "For I fear that perhaps when I come I may find you not as I wish, and that you may find me not as you wish — that perhaps there may be quarreling, jealousy, anger, hostility, slander, gossip, conceit, and disorder."}, {"b": "Galatians", "c": 5, "v": 20, "t": "idolatry, sorcery, enmity, strife, jealousy, fits of anger, rivalries, dissensions, divisions,"}, {"b": "Galatians", "c": 5, "v": 26, "t": "Let us not become conceited, provoking one another, envying one another."}, {"b": "Ephesians", "c": 2, "v": 3, "t": "among whom we all once lived in the passions of our flesh, carrying out the desires of the body and the mind, and were by nature children of wrath, like the rest of mankind."}, {"b": "Ephesians", "c": 4, "v": 26, "t": "Be angry and do not sin; do not let the sun go down on your anger,"}, {"b": "Ephesians", "c": 4, "v": 31, "t": "Let all bitterness and wrath and anger and clamor and slander be put away from you, along with all malice."}, {"b": "Ephesians", "c": 5, "v": 6, "t": "Let no one deceive you with empty words, for because of these things the wrath of God comes upon the sons of disobedience."}, {"b": "Ephesians", "c": 6, "v": 4, "t": "Fathers, do not provoke your children to anger, but bring them up in the discipline and instruction of the Lord."}, {"b": "Colossians", "c": 3, "v": 6, "t": "On account of these the wrath of God is coming."}, {"b": "Colossians", "c": 3, "v": 8, "t": "But now you must put them all away: anger, wrath, malice, slander, and obscene talk from your mouth."}, {"b": "Colossians", "c": 3, "v": 21, "t": "Fathers, do not provoke your children, lest they become discouraged."}, {"b": "1 Thessalonians", "c": 1, "v": 10, "t": "and to wait for his Son from heaven, whom he raised from the dead, Jesus who delivers us from the wrath to come."}, {"b": "1 Thessalonians", "c": 2, "v": 16, "t": "by hindering us from speaking to the Gentiles that they might be saved — so as always to fill up the measure of their sins. But wrath has come upon them at last!"}, {"b": "1 Thessalonians", "c": 5, "v": 9, "t": "For God has not destined us for wrath, but to obtain salvation through our Lord Jesus Christ,"}, {"b": "1 Timothy", "c": 2, "v": 8, "t": "I desire then that in every place the men should pray, lifting holy hands without anger or quarreling;"}, {"b": "Titus", "c": 1, "v": 7, "t": "For an overseer, as God's steward, must be above reproach. He must not be arrogant or quick-tempered or a drunkard or violent or greedy for gain,"}, {"b": "Hebrews", "c": 3, "v": 10, "t": "Therefore I was provoked with that generation, and said, ‘They always go astray in their heart; they have not known my ways.’"}, {"b": "Hebrews", "c": 3, "v": 11, "t": "As I swore in my wrath, ‘They shall not enter my rest.’”"}, {"b": "Hebrews", "c": 3, "v": 17, "t": "And with whom was he provoked for forty years? Was it not with those who sinned, whose bodies fell in the wilderness?"}, {"b": "Hebrews", "c": 4, "v": 3, "t": "For we who have believed enter that rest, as he has said, “As I swore in my wrath, ‘They shall not enter my rest,’” although his works were finished from the foundation of the world."}, {"b": "Hebrews", "c": 10, "v": 27, "t": "but a fearful expectation of judgment, and a fury of fire that will consume the adversaries."}, {"b": "Hebrews", "c": 11, "v": 27, "t": "By faith he left Egypt, not being afraid of the anger of the king, for he endured as seeing him who is invisible."}, {"b": "James", "c": 1, "v": 19, "t": "Know this, my beloved brothers: let every person be quick to hear, slow to speak, slow to anger;"}, {"b": "James", "c": 1, "v": 20, "t": "for the anger of man does not produce the righteousness of God."}, {"b": "Revelation", "c": 6, "v": 16, "t": "calling to the mountains and rocks, “Fall on us and hide us from the face of him who is seated on the throne, and from the wrath of the Lamb,"}, {"b": "Revelation", "c": 6, "v": 17, "t": "for the great day of their wrath has come, and who can stand?”"}, {"b": "Revelation", "c": 11, "v": 18, "t": "The nations raged, but your wrath came, and the time for the dead to be judged, and for rewarding your servants, the prophets and saints, and those who fear your name, both small and great, and for destroying the destroyers of the earth.”"}, {"b": "Revelation", "c": 12, "v": 12, "t": "Therefore, rejoice, O heavens and you who dwell in them! But woe to you, O earth and sea, for the devil has come down to you in great wrath, because he knows that his time is short!”"}, {"b": "Revelation", "c": 12, "v": 17, "t": "Then the dragon became furious with the woman and went off to make war on the rest of her offspring, on those who keep the commandments of God and hold to the testimony of Jesus. And he stood on the sand of the sea."}, {"b": "Revelation", "c": 14, "v": 10, "t": "he also will drink the wine of God's wrath, poured full strength into the cup of his anger, and he will be tormented with fire and sulfur in the presence of the holy angels and in the presence of the Lamb."}, {"b": "Revelation", "c": 14, "v": 19, "t": "So the angel swung his sickle across the earth and gathered the grape harvest of the earth and threw it into the great winepress of the wrath of God."}, {"b": "Revelation", "c": 15, "v": 1, "t": "Then I saw another sign in heaven, great and amazing, seven angels with seven plagues, which are the last, for with them the wrath of God is finished."}, {"b": "Revelation", "c": 15, "v": 7, "t": "And one of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God who lives forever and ever,"}, {"b": "Revelation", "c": 16, "v": 1, "t": "Then I heard a loud voice from the temple telling the seven angels, “Go and pour out on the earth the seven bowls of the wrath of God.”"}, {"b": "Revelation", "c": 16, "v": 19, "t": "The great city was split into three parts, and the cities of the nations fell, and God remembered Babylon the great, to make her drain the cup of the wine of the fury of his wrath."}, {"b": "Revelation", "c": 19, "v": 15, "t": "From his mouth comes a sharp sword with which to strike down the nations, and he will rule them with a rod of iron. He will tread the winepress of the fury of the wrath of God the Almighty."}]}</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('data').textContent);
  var app=document.getElementById('app');
  var READ_KEY='lim_anger_read';
  function readSet(){try{return JSON.parse(localStorage.getItem(READ_KEY)||'[]')}catch(e){return[]}}
  function markRead(n){var s=readSet();if(s.indexOf(n)<0){s.push(n);try{localStorage.setItem(READ_KEY,JSON.stringify(s))}catch(e){}}}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function passage(p){return '<div class="passage"><div class="ref"><a href="'+p.link+'" target="_blank" rel="noopener">'+esc(p.label)+'</a></div><p class="txt">'+p.verses.map(function(v){return '<sup>'+v[0]+'</sup>'+esc(v[1])}).join(' ')+'</p></div>'}
  function storyCard(s){return '<a class="card'+(readSet().indexOf(s.n)>=0?' done':'')+'" href="#/story/'+s.n+'"><span class="num">Story '+s.n+'</span><div class="t">'+esc(s.title)+'</div><div class="s">'+esc(s.where)+'</div></a>'}
  function themeCard(t){return '<a class="card" href="#/theme/'+t.n+'"><span class="num">Theme '+t.n+'</span><div class="t">'+esc(t.title)+'</div><div class="s">'+t.passages.length+' passages</div></a>'}
  function pathCard(p){return '<a class="card path" href="#/path/'+p.id+'"><div class="t">'+esc(p.title)+'</div><div class="s">'+p.stops.length+' stops</div></a>'}
  function stopTitle(st){if(st.kind==='story')return 'Story: '+D.stories[st.n-1].title;if(st.kind==='theme')return 'Theme: '+D.themes[st.n-1].title;return st.p.label}
  var prevNext=null; // for arrow keys

  function home(){
    var r=readSet().length;
    return '<div class="screen"><span class="eyebrow">Christ-Centered Anger Management · ESV</span><h1>Where do you want to start?</h1>'
      +'<p class="lede">Pick the question closest to you and walk a short path through what the Bible says — or browse the stories and themes on your own.</p>'
      +'<div class="cards">'+D.paths.map(pathCard).join('')+'</div>'
      +'<h2>Or explore on your own</h2><div class="tiles">'
      +'<a class="card big" href="#/stories"><span class="num">'+D.stories.length+' stories</span><div class="t">Where anger drives the plot</div><div class="s">'+(r?r+' read so far':'Cain to Ephesus, one at a time')+'</div></a>'
      +'<a class="card big" href="#/themes"><span class="num">'+D.themes.length+' themes</span><div class="t">The teaching passages</div><div class="s">God\'s anger, ours, Jesus, forgiveness</div></a>'
      +'<a class="card big" href="#/search"><span class="num">'+D.conc.length+' verses</span><div class="t">Find a verse</div><div class="s">Every ESV verse that speaks of anger</div></a>'
      +'</div><p class="foot">Scripture quotations are from The ESV® Bible (The Holy Bible, English Standard Version®), © 2001 by Crossway, a publishing ministry of Good News Publishers. Used by permission. All rights reserved. Working draft for LIM staff — not for distribution.</p></div>';
  }
  function stories(){return '<div class="screen"><div class="crumb"><a href="#/">Start</a> › Stories</div><h1>Stories where anger drives the plot</h1><p class="lede">In Bible order. Each one: what happened, the verses that carry it, what it shows, and a question to sit with.</p><div class="cards">'+D.stories.map(storyCard).join('')+'</div></div>'}
  function themes(){return '<div class="screen"><div class="crumb"><a href="#/">Start</a> › Themes</div><h1>The teaching passages</h1><p class="lede">Nine themes, each one a session\'s worth of Scripture.</p><div class="cards">'+D.themes.map(themeCard).join('')+'</div></div>'}
  function storyBody(s){
    return '<span class="eyebrow">Story '+s.n+' of '+D.stories.length+'</span><h1>'+esc(s.title)+'</h1><p class="where">'+esc(s.where)+'</p><p>'+esc(s.summary)+'</p>'
      +s.passages.map(passage).join('')
      +'<div class="lesson"><b>What it shows.</b> '+esc(s.lesson)+'</div>'
      +'<div class="question"><span class="eyebrow">To sit with</span><p>'+esc(s.question)+'</p></div>';
  }
  function story(n){
    var s=D.stories[n-1]; if(!s)return home(); markRead(n);
    var p=D.stories[n-2],nx=D.stories[n];
    prevNext=[p?'#/story/'+p.n:null,nx?'#/story/'+nx.n:null];
    return '<div class="screen"><div class="crumb"><a href="#/">Start</a> › <a href="#/stories">Stories</a></div><div class="panel">'+storyBody(s)+'</div>'
      +'<div class="nav">'+(p?'<a class="btn ghost" href="#/story/'+p.n+'">‹ Prev</a>':'<a class="btn ghost" href="#/stories">‹ All stories</a>')
      +(nx?'<a class="btn next" href="#/story/'+nx.n+'"><span class="lbl">Next story ›</span><small>'+esc(nx.title)+'</small></a>':'<a class="btn next" href="#/"><span class="lbl">Finished ›</span><small>Back to the start</small></a>')+'</div>'
      +'<p class="kbd">Use <b>←</b> <b>→</b> to move between stories</p></div>';
  }
  function themeBody(t,i,inPath){
    var m=t.passages.length; i=Math.min(Math.max(i||0,0),m-1);
    var dots='<div class="dots">'+t.passages.map(function(_,k){return '<a href="#/theme/'+t.n+'/'+(k+1)+'" class="'+(k===i?'on':'')+'" title="'+esc(t.passages[k].label)+'"></a>'}).join('')+'</div>';
    if(inPath) return '<span class="eyebrow">Theme '+t.n+'</span><h1>'+esc(t.title)+'</h1><p class="lede">'+esc(t.intro)+'</p>'+t.passages.map(passage).join('');
    return '<span class="eyebrow">Theme '+t.n+' of '+D.themes.length+' · passage '+(i+1)+' of '+m+'</span><h1>'+esc(t.title)+'</h1><p class="lede">'+esc(t.intro)+'</p>'+dots+passage(t.passages[i]);
  }
  function theme(n,i){
    var t=D.themes[n-1]; if(!t)return home(); i=(parseInt(i,10)||1)-1; var m=t.passages.length;
    var prev=i>0?'#/theme/'+n+'/'+i:(D.themes[n-2]?'#/theme/'+(n-1)+'/'+D.themes[n-2].passages.length:null);
    var next=i<m-1?'#/theme/'+n+'/'+(i+2):(D.themes[n]?'#/theme/'+(n+1)+'/1':null);
    prevNext=[prev,next];
    var nl=i<m-1?'Next passage ›':(D.themes[n]?'Next theme ›':'Finished ›');
    var ns=i<m-1?t.passages[i+1].label:(D.themes[n]?D.themes[n].title:'Back to the start');
    return '<div class="screen"><div class="crumb"><a href="#/">Start</a> › <a href="#/themes">Themes</a></div><div class="panel">'+themeBody(t,i)+'</div>'
      +'<div class="nav">'+(prev?'<a class="btn ghost" href="'+prev+'">‹ Prev</a>':'<a class="btn ghost" href="#/themes">‹ All themes</a>')
      +'<a class="btn next" href="'+(next||'#/')+'"><span class="lbl">'+nl+'</span><small>'+esc(ns)+'</small></a></div>'
      +'<p class="kbd">Use <b>←</b> <b>→</b> to move through the passages · <a href="/anger-scripture#t'+n+'">read this theme as one page</a></p></div>';
  }
  function path(id,step){
    var p=null;D.paths.forEach(function(x){if(x.id===id)p=x});if(!p)return home();
    if(!step){prevNext=null;
      return '<div class="screen"><div class="crumb"><a href="#/">Start</a> › Path</div><span class="eyebrow">A path · '+p.stops.length+' stops</span><h1>'+esc(p.title)+'</h1><p class="lede">'+esc(p.intro)+'</p>'
        +'<ol class="steps">'+p.stops.map(function(st,k){return '<li><b>'+(k+1)+'</b><a href="#/path/'+id+'/'+(k+1)+'">'+esc(stopTitle(st))+'</a></li>'}).join('')+'</ol>'
        +'<div class="nav"><a class="btn ghost" href="#/">‹ Back</a><a class="btn next" href="#/path/'+id+'/1"><span class="lbl">Begin ›</span><small>'+esc(stopTitle(p.stops[0]))+'</small></a></div></div>';}
    var k=Math.min(Math.max(parseInt(step,10)||1,1),p.stops.length),st=p.stops[k-1],body='';
    if(st.kind==='story'){markRead(st.n);body=storyBody(D.stories[st.n-1]);}
    else if(st.kind==='theme'){body=themeBody(D.themes[st.n-1],0,true);}
    else{body='<span class="eyebrow">Passage</span><h1>'+esc(st.p.label)+'</h1>'+passage(st.p);}
    var prev=k>1?'#/path/'+id+'/'+(k-1):'#/path/'+id, next=k<p.stops.length?'#/path/'+id+'/'+(k+1):null;
    prevNext=[prev,next];
    var others=D.paths.filter(function(x){return x.id!==id}).slice(0,3);
    return '<div class="screen"><div class="crumb"><a href="#/">Start</a> › <a href="#/path/'+id+'">'+esc(p.title)+'</a></div>'
      +'<span class="eyebrow">Stop '+k+' of '+p.stops.length+'</span><div class="prog"><i style="width:'+Math.round(k/p.stops.length*100)+'%"></i></div>'
      +'<div class="panel">'+body+'</div>'
      +'<div class="nav"><a class="btn ghost" href="'+prev+'">‹ Prev</a>'
      +(next?'<a class="btn next" href="'+next+'"><span class="lbl">Next stop ›</span><small>'+esc(stopTitle(p.stops[k]))+'</small></a>':'<a class="btn next" href="#/"><span class="lbl">End of path ›</span><small>Back to the start</small></a>')+'</div>'
      +(next?'':'<h2>Another path</h2><div class="cards">'+others.map(pathCard).join('')+'</div>')
      +'<p class="kbd">Use <b>←</b> <b>→</b> to move along the path</p></div>';
  }
  var CHIPS=['anger','angry','wrath','rage','fury','indignation','provoke','slow to anger'];
  function searchScreen(q){
    prevNext=null; q=(q||'').trim();
    var res=[],rx=null;
    if(q){var qq=q.toLowerCase();rx=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
      res=D.conc.filter(function(v){return v.t.toLowerCase().indexOf(qq)>=0||(v.b+' '+v.c+':'+v.v).toLowerCase().indexOf(qq)===0||v.b.toLowerCase()===qq})}
    var list=q?(res.length?res.slice(0,150).map(function(v){var t=esc(v.t);if(rx)t=t.replace(rx,'<mark>$1</mark>');return '<div class="cv"><a class="cref" target="_blank" rel="noopener" href="https://www.esv.org/'+encodeURIComponent((v.b==='Psalms'?'Psalm':v.b)+' '+v.c+':'+v.v)+'/">'+esc(v.b==='Psalms'?'Psalm':v.b)+' '+v.c+':'+v.v+'</a>'+t+'</div>'}).join('')+(res.length>150?'<p class="count">Showing 150 of '+res.length+' — narrow the search.</p>':''):'<p class="count">Nothing matches that. Try a word like <i>wrath</i> or a book like <i>Proverbs</i>.</p>'):'';
    return '<div class="screen"><div class="crumb"><a href="#/">Start</a> › Find a verse</div><h1>Find a verse</h1><p class="lede">Every verse in the ESV that speaks of anger — '+D.conc.length+' of them. Type a word, a phrase, or a book name.</p>'
      +'<input class="search" id="q" type="search" placeholder="e.g. slow to anger · Proverbs · sun go down" value="'+esc(q)+'" autocomplete="off">'
      +'<div class="chips">'+CHIPS.map(function(c){return '<a class="chip'+(c===q?' on':'')+'" href="#/search/'+encodeURIComponent(c)+'">'+c+'</a>'}).join('')+'</div>'
      +(q?'<p class="count">'+res.length+' verse'+(res.length===1?'':'s')+'</p>':'')+list+'</div>';
  }
  function route(){
    var h=location.hash.replace(/^#\/?/,''),parts=h.split('/').map(decodeURIComponent),v=parts[0]||'';
    var out;
    if(v==='')out=home();
    else if(v==='stories')out=stories();
    else if(v==='story')out=story(parseInt(parts[1],10));
    else if(v==='themes')out=themes();
    else if(v==='theme')out=theme(parseInt(parts[1],10),parts[2]);
    else if(v==='path')out=path(parts[1],parts[2]);
    else if(v==='search')out=searchScreen(parts.slice(1).join('/'));
    else out=home();
    app.innerHTML=out; window.scrollTo(0,0);
    var q=document.getElementById('q');
    if(q){var t;q.addEventListener('input',function(){clearTimeout(t);t=setTimeout(function(){history.replaceState(null,'','#/search/'+encodeURIComponent(q.value));var pos=q.selectionStart;route();var q2=document.getElementById('q');q2.focus();q2.setSelectionRange(pos,pos);},250)});if(!q.value)q.focus();}
  }
  document.addEventListener('keydown',function(e){if(!prevNext||e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft'&&prevNext[0])location.hash=prevNext[0];if(e.key==='ArrowRight'&&prevNext[1])location.hash=prevNext[1];});
  window.addEventListener('hashchange',route); route();
})();
</script>
</body>
